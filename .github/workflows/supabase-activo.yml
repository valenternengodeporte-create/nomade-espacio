# Mantiene activo el proyecto de Supabase.
# El plan gratuito pausa el proyecto si pasa 7 días sin actividad.
# Esto hace una consulta liviana a la base dos veces por semana (lunes y jueves, 9:00 de Argentina).
# Solo lee: no crea, cambia ni borra nada. Usa la clave pública que ya está en index.html.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "7 12 * * 1,4"   # lunes y jueves 12:07 UTC = 9:07 Argentina
  workflow_dispatch:          # botón para correrlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://xqazoxxthaupsknqknmb.supabase.co/rest/v1/safety_zones?select=id&limit=1" \
            -H "apikey: sb_publishable_pkFVPhfDQYyTnw7S-FU6XA_rjEMZhLm")
          echo "Respuesta de Supabase: $code"
          if [ "$code" != "200" ]; then
            echo "Supabase no respondió bien. Puede estar pausado: entrá a supabase.com y reanudalo."
            exit 1
          fi
