<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nómade con Sentido — Plataforma</title>
<meta name="description" content="Espacio privado de acompañamiento para quienes dan el paso de vivir afuera con sentido.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12151F">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23171B26%22/><path d=%22M20 60 Q50 30 80 60%22 stroke=%22%23E3A857%22 stroke-width=%226%22 fill=%22none%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#12151F; --bg-solid:#1F2433; --bg-raised:rgba(31,36,51,.62); --bg-deep:rgba(18,21,31,.7);
    --ink:#F2EFE9; --ink-dim:#B9BDC9; --ink-faint:#7D8395;
    --amber:#E3A857; --amber-hi:#F6C98A; --amber-soft:rgba(227,168,87,.14);
    --teal:#5B9AA0; --teal-soft:rgba(91,154,160,.16);
    --line:rgba(255,255,255,.08); --line-strong:#333B4D; --danger:#C97B63; --danger-soft:rgba(201,123,99,.14);
    --radius:18px; --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;}
  ::selection{background:var(--amber);color:#12151F;}

  /* ---------- fondo vivo ---------- */
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;}
  .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;will-change:transform;}
  .o1{width:560px;height:560px;background:radial-gradient(circle,rgba(227,168,87,.55) 0%,transparent 65%);top:-220px;right:-180px;animation:drift1 28s ease-in-out infinite alternate;}
  .o2{width:620px;height:620px;background:radial-gradient(circle,rgba(91,154,160,.45) 0%,transparent 65%);bottom:-260px;left:-220px;animation:drift2 34s ease-in-out infinite alternate;}
  .o3{width:320px;height:320px;background:radial-gradient(circle,rgba(201,123,99,.3) 0%,transparent 65%);top:40%;left:55%;animation:drift3 22s ease-in-out infinite alternate;}
  @keyframes drift1{to{transform:translate(-120px,160px) scale(1.15);}}
  @keyframes drift2{to{transform:translate(160px,-120px) scale(1.1);}}
  @keyframes drift3{to{transform:translate(-200px,-80px) scale(.85);}}
  .grain{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}

  /* ---------- layout y tipografía ---------- */
  .wrap{max-width:760px;margin:0 auto;padding:36px 20px 90px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:10px;}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(30px,6vw,46px);line-height:1.08;letter-spacing:-.015em;margin:0 0 16px;}
  h1 em,h2 em{font-style:italic;color:var(--amber);font-weight:400;}
  h2{font-family:'Fraunces',serif;font-weight:500;font-size:21px;margin:0 0 12px;}
  p.lead{color:var(--ink-dim);font-size:16px;line-height:1.65;margin:0 0 22px;max-width:580px;}
  .hint{font-size:13px;color:var(--ink-dim);line-height:1.55;}
  .center-t{text-align:center;}
  .link{color:var(--teal);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s;}
  .link:hover{border-color:var(--teal);}
  .hidden{display:none !important;}

  /* entrada escalonada */
  .rv{opacity:0;transform:translateY(16px);animation:rise .8s var(--ease) forwards;animation-delay:calc(var(--d,0) * 90ms);}
  @keyframes rise{to{opacity:1;transform:none;}}

  /* ---------- tarjetas ---------- */
  .card{background:var(--bg-raised);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:var(--radius);padding:26px;margin-bottom:16px;box-shadow:0 20px 50px -30px rgba(0,0,0,.7);}

  /* ---------- formularios ---------- */
  .field{margin-bottom:16px;}
  label{display:block;font-size:12.5px;color:var(--ink-dim);margin-bottom:7px;letter-spacing:.01em;}
  input,select,textarea{width:100%;background:var(--bg-deep);border:1px solid var(--line-strong);border-radius:10px;padding:13px 14px;color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;transition:border-color .2s, box-shadow .2s, background .2s;}
  input:hover,select:hover,textarea:hover{border-color:#46506a;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-soft);background:rgba(18,21,31,.9);}
  textarea{min-height:100px;resize:vertical;line-height:1.55;}
  select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%23B9BDC9' stroke-width='1.6' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px;}
  button:focus-visible,a:focus-visible,.opt:focus-visible{outline:2px solid var(--amber);outline-offset:3px;}

  /* ---------- botones ---------- */
  button.primary{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 24px;border-radius:100px;border:none;background:linear-gradient(135deg,var(--amber-hi),var(--amber));color:#12151F;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 10px 30px -12px rgba(227,168,87,.7);transition:transform .25s var(--ease), box-shadow .25s var(--ease), opacity .2s;}
  button.primary::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:left .7s var(--ease);}
  button.primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 16px 36px -12px rgba(227,168,87,.85);}
  button.primary:hover:not(:disabled)::after{left:130%;}
  button.primary svg{transition:transform .3s var(--ease);}
  button.primary:hover:not(:disabled) svg{transform:translateX(4px);}
  button.primary:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;}
  button.primary.wide{width:100%;}
  button.primary.loading{pointer-events:none;}
  button.primary.loading svg{display:none;}
  button.primary.loading::before{content:'';width:16px;height:16px;border-radius:50%;border:2px solid rgba(18,21,31,.3);border-top-color:#12151F;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  button.ghost{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.02);border:1px solid var(--line-strong);color:var(--ink-dim);padding:9px 15px;border-radius:100px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s var(--ease);}
  button.ghost:hover:not(:disabled){border-color:var(--teal);color:var(--teal);background:var(--teal-soft);}
  button.ghost:disabled{opacity:.3;cursor:not-allowed;}
  button.ghost.danger:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);}

  .err{color:var(--danger);font-size:13px;min-height:18px;margin:0 0 10px;}
  .err.shake{animation:shake .4s;}
  @keyframes shake{20%,60%{transform:translateX(-6px);}40%,80%{transform:translateX(6px);}}

  /* ---------- amanecer (firma visual) ---------- */
  .sunrise{width:100%;max-width:230px;display:block;margin:0 0 18px -6px;overflow:visible;}
  .sunrise.sm{max-width:170px;margin-left:auto;margin-right:auto;}
  .sun-rise{transform:translateY(52px);animation:sunUp 2s var(--ease) .15s forwards;}
  @keyframes sunUp{to{transform:translateY(0);}}
  .sun-glow{animation:breathe 5s ease-in-out 2s infinite;transform-origin:160px 80px;}
  @keyframes breathe{50%{opacity:.55;transform:scale(1.12);}}
  .draw{fill:none;stroke-linecap:round;stroke-dasharray:320;stroke-dashoffset:320;animation:draw 1.8s var(--ease) forwards;}
  .draw.d2{animation-delay:.25s;} .draw.d3{animation-delay:.45s;}
  @keyframes draw{to{stroke-dashoffset:0;}}

  /* ---------- auth / pantallas centradas ---------- */
  .auth{max-width:440px;margin:6vh auto 0;}
  .center{max-width:380px;margin:9vh auto 0;text-align:center;}
  .center p.lead{margin-left:auto;margin-right:auto;}
  .loading-screen{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}

  /* ---------- bienvenida ---------- */
  .seal{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:14px;background:var(--teal-soft);border:1px solid rgba(91,154,160,.35);margin:0 0 26px;max-width:580px;}
  .seal svg{color:var(--teal);flex-shrink:0;margin-top:2px;}
  .seal strong{display:block;font-size:14px;margin-bottom:3px;color:var(--ink);}
  .seal span{font-size:13.5px;color:var(--ink-dim);line-height:1.55;}
  .path{display:flex;align-items:flex-start;margin:6px 0 30px;position:relative;}
  .step{flex:1;position:relative;text-align:center;padding-top:0;}
  .step::before{content:'';position:absolute;top:15px;left:calc(-50% + 18px);right:calc(50% + 18px);height:2px;background:var(--line-strong);}
  .step:first-child::before{display:none;}
  .step.done::before,.step.current::before{background:linear-gradient(90deg,var(--teal),var(--amber));}
  .step-dot{width:32px;height:32px;margin:0 auto 10px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12.5px;border:1px solid var(--line-strong);background:var(--bg-solid);color:var(--ink-faint);position:relative;z-index:1;}
  .step.done .step-dot{background:var(--teal);border-color:var(--teal);color:#12151F;}
  .step.current .step-dot{border-color:var(--amber);color:var(--amber);box-shadow:0 0 0 0 rgba(227,168,87,.5);animation:ping 2.2s infinite;}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(227,168,87,.45);}80%,100%{box-shadow:0 0 0 12px rgba(227,168,87,0);}}
  .step-label{font-size:12.5px;color:var(--ink-dim);line-height:1.35;padding:0 4px;}
  .step.current .step-label{color:var(--ink);}

  /* ---------- dashboard ---------- */
  .topbar{position:sticky;top:12px;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 8px 8px 14px;margin-bottom:34px;border-radius:100px;background:rgba(23,27,38,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-size:15.5px;}
  .top-right{display:flex;align-items:center;gap:8px;}
  .avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:#12151F;background:linear-gradient(135deg,var(--amber-hi),var(--teal));}
  .dash-hero{margin-bottom:24px;}
  .dash-hero h1{margin-bottom:6px;}

  .tabs{position:relative;display:flex;gap:4px;padding:5px;margin-bottom:26px;border-radius:100px;background:var(--bg-raised);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab-ind{position:absolute;top:5px;left:0;height:calc(100% - 10px);border-radius:100px;background:var(--amber-soft);border:1px solid rgba(227,168,87,.55);transition:transform .45s var(--ease), width .45s var(--ease);pointer-events:none;}
  .tab{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;padding:10px 16px;border-radius:100px;border:none;background:none;color:var(--ink-dim);font-size:13.5px;cursor:pointer;font-family:'Inter',sans-serif;transition:color .25s;}
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--amber);}
  .tab-pane{animation:paneIn .55s var(--ease);}
  @keyframes paneIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .foot-note{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;margin-top:56px;font-size:12.5px;color:var(--ink-faint);}

  /* ---------- skeleton ---------- */
  .skel{border-radius:var(--radius);border:1px solid var(--line);background:var(--bg-raised);padding:24px;margin-bottom:14px;}
  .skel i{display:block;height:12px;border-radius:6px;margin-bottom:12px;background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;}
  @keyframes shimmer{to{background-position:-200% 0;}}

  /* ---------- test ---------- */
  .journey{margin-bottom:18px;}
  .journey-track{position:relative;height:6px;border-radius:6px;background:rgba(255,255,255,.07);}
  .journey-fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:6px;background:linear-gradient(90deg,var(--teal),var(--amber));transition:width .6s var(--ease);}
  .journey-sun{position:absolute;top:50%;left:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:radial-gradient(circle,var(--amber-hi),var(--amber));box-shadow:0 0 18px 4px rgba(227,168,87,.55);transition:left .6s var(--ease);}
  .journey-meta{display:flex;justify-content:space-between;margin-top:12px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-dim);letter-spacing:.04em;}
  .banner{display:flex;gap:12px;align-items:flex-start;background:var(--amber-soft);border:1px solid rgba(227,168,87,.4);border-radius:12px;padding:13px 15px;font-size:13.5px;line-height:1.5;margin-bottom:16px;}
  .banner svg{color:var(--amber);flex-shrink:0;margin-top:1px;}
  .kbd-hint{color:var(--ink-faint);}
  .q-stage{position:relative;min-height:300px;}
  .q-card{background:var(--bg-raised);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:var(--radius);padding:28px 26px 22px;}
  .q-card.in-right{animation:inRight .5s var(--ease);}
  .q-card.in-left{animation:inLeft .5s var(--ease);}
  @keyframes inRight{from{opacity:0;transform:translateX(36px);}to{opacity:1;transform:none;}}
  @keyframes inLeft{from{opacity:0;transform:translateX(-36px);}to{opacity:1;transform:none;}}
  .q-chip{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);background:var(--teal-soft);padding:5px 10px;border-radius:100px;margin-bottom:18px;}
  .q-num{font-family:'Fraunces',serif;font-style:italic;font-size:44px;line-height:1;color:rgba(227,168,87,.35);margin-bottom:8px;}
  .q-text{font-family:'Fraunces',serif;font-size:clamp(19px,3.6vw,23px);line-height:1.4;margin:0 0 24px;}
  .scale{display:flex;gap:8px;}
  .opt{flex:1;height:54px;border-radius:12px;border:1px solid var(--line-strong);background:var(--bg-deep);color:var(--ink-dim);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:16px;transition:all .22s var(--ease);}
  .opt:hover{border-color:var(--amber);color:var(--ink);transform:translateY(-3px);}
  .opt.selected{background:linear-gradient(135deg,var(--amber-hi),var(--amber));border-color:var(--amber);color:#12151F;transform:translateY(-3px) scale(1.04);box-shadow:0 10px 24px -10px rgba(227,168,87,.8);}
  .scale-caption{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-faint);margin-top:9px;}
  .q-nav{display:flex;justify-content:space-between;margin-top:24px;}
  .done-mark{width:64px;height:64px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:var(--teal-soft);border:1px solid var(--teal);color:var(--teal);animation:pop .6s var(--ease);}
  .done-mark svg{width:30px;height:30px;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .6s .25s var(--ease) forwards;}
  @keyframes pop{from{transform:scale(.4);opacity:0;}to{transform:none;opacity:1;}}

  /* ---------- recursos ---------- */
  .res-grid{display:grid;gap:14px;}
  .res-card{background:var(--bg-raised);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:var(--radius);padding:22px;transition:transform .35s var(--ease), border-color .3s, box-shadow .35s var(--ease);}
  .res-card:hover{transform:translateY(-3px);border-color:rgba(227,168,87,.3);box-shadow:0 24px 50px -30px rgba(227,168,87,.35);}
  .res-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .badge{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:100px;}
  .badge svg{width:13px;height:13px;}
  .b-video{color:var(--amber);background:var(--amber-soft);}
  .b-imagen{color:var(--teal);background:var(--teal-soft);}
  .b-texto{color:var(--ink-dim);background:rgba(255,255,255,.05);}
  .res-date{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);}
  .res-card h3{font-family:'Fraunces',serif;font-size:20px;font-weight:500;line-height:1.3;margin:0 0 6px;}
  .media{position:relative;border-radius:12px;overflow:hidden;margin:12px 0 4px;background:#0c0e15;}
  .media iframe{width:100%;aspect-ratio:16/9;border:0;display:block;}
  .media video{width:100%;display:block;}
  .media img{width:100%;display:block;cursor:zoom-in;transition:transform .6s var(--ease);}
  .media:hover img{transform:scale(1.03);}
  .res-body{color:var(--ink-dim);font-size:15px;line-height:1.7;margin:10px 0 0;}
  .res-body.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
  .more{background:none;border:none;padding:0;margin-top:8px;color:var(--amber);font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;}
  .empty{text-align:center;padding:44px 24px;}
  .empty-icon{width:58px;height:58px;margin:0 auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--amber-soft);color:var(--amber);animation:float 4s ease-in-out infinite;}
  @keyframes float{50%{transform:translateY(-6px);}}
  .lightbox{position:fixed;inset:0;z-index:50;background:rgba(8,10,15,.88);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;animation:paneIn .3s var(--ease);}
  .lightbox img{max-width:100%;max-height:90vh;border-radius:12px;}

  /* ---------- seguridad (próximamente) ---------- */
  .soon{text-align:center;padding:40px 26px;}
  .soon-icon{width:72px;height:72px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--teal);background:var(--teal-soft);position:relative;}
  .soon-icon svg{width:32px;height:32px;}
  .soon-icon::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(91,154,160,.4);animation:ring 2.6s ease-out infinite;}
  @keyframes ring{from{transform:scale(.85);opacity:1;}to{transform:scale(1.35);opacity:0;}}
  .soon-tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);border:1px solid rgba(227,168,87,.45);padding:4px 10px;border-radius:100px;margin-bottom:14px;}
  .soon p.lead{margin-left:auto;margin-right:auto;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .chip{font-size:12.5px;color:var(--ink-dim);border:1px dashed var(--line-strong);padding:7px 12px;border-radius:100px;}

  /* ---------- admin ---------- */
  .sub-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
  .sub-tab{padding:8px 14px;border-radius:100px;border:1px solid var(--line-strong);background:none;color:var(--ink-dim);font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;}
  .sub-tab.active{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .adm-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);animation:paneIn .4s var(--ease) both;}
  .adm-row:last-child{border-bottom:none;}
  .adm-actions{display:flex;gap:6px;flex-shrink:0;}
  .t-row{border-bottom:1px solid var(--line);}
  .t-row:last-child{border-bottom:none;}
  .t-head{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 4px;background:none;border:none;color:var(--ink);font-family:'Inter',sans-serif;text-align:left;cursor:pointer;}
  .t-head:hover .t-name{color:var(--amber);}
  .t-name{font-weight:600;transition:color .2s;}
  .t-right{display:flex;align-items:center;gap:10px;}
  .t-right svg{transition:transform .35s var(--ease);color:var(--ink-faint);}
  .t-row.open .t-right svg{transform:rotate(180deg);}
  .t-detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease);}
  .t-row.open .t-detail{grid-template-rows:1fr;}
  .t-inner{overflow:hidden;}
  .t-box{background:var(--bg-deep);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px;font-size:13.5px;line-height:1.6;}
  .metric{margin-top:12px;}
  .metric-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:12.5px;color:var(--ink-dim);}
  .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden;}
  .bar-fill{height:100%;width:0;border-radius:6px;transition:width .8s var(--ease) .1s;}
  .t-row.open .bar-fill{width:var(--w);}
  .bar-fill.low{background:var(--danger);} .bar-fill.mid{background:var(--amber);} .bar-fill.high{background:var(--teal);}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 9px;border-radius:100px;border:1px solid var(--line-strong);white-space:nowrap;}
  .tag.low{color:var(--danger);border-color:var(--danger);background:var(--danger-soft);}
  .tag.mid{color:var(--amber);border-color:var(--amber);background:var(--amber-soft);}
  .tag.high{color:var(--teal);border-color:var(--teal);background:var(--teal-soft);}

  /* ---------- tu plan (cliente) ---------- */
  .plan-card{position:relative;overflow:hidden;background:var(--bg-raised);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:var(--radius);padding:26px;margin-bottom:16px;}
  .plan-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--amber));}
  .plan-card h2{font-size:24px;margin-bottom:10px;}
  .prewrap{white-space:pre-wrap;}
  .plan-label{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin:22px 0 8px;}
  .plan-steps{list-style:none;margin:0;padding:0;counter-reset:st;}
  .plan-steps li{counter-increment:st;display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.55;color:var(--ink);}
  .plan-steps li:last-child{border-bottom:none;}
  .plan-steps li::before{content:counter(st);flex-shrink:0;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--amber);background:var(--amber-soft);border:1px solid rgba(227,168,87,.45);}

  /* ---------- admin: clientes y notas ---------- */
  .cl-row{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 6px;background:none;border:none;border-bottom:1px solid var(--line);color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;text-align:left;cursor:pointer;transition:background .2s, padding .25s var(--ease);border-radius:10px;}
  .cl-row:last-child{border-bottom:none;}
  .cl-row:hover{background:rgba(255,255,255,.03);padding-left:12px;}
  .cl-row:hover .cl-name{color:var(--amber);}
  .cl-name{font-weight:600;transition:color .2s;}
  .cl-left{display:flex;align-items:center;gap:12px;}
  .cl-left .avatar{width:32px;height:32px;font-size:14px;}
  .back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;padding:0;margin-bottom:14px;color:var(--ink-dim);font-size:13.5px;cursor:pointer;font-family:'Inter',sans-serif;transition:color .2s;}
  .back:hover{color:var(--amber);}
  .cl-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
  .cl-head .avatar{width:46px;height:46px;font-size:20px;}
  .cl-head h2{font-size:26px;margin:0;}
  .layer-badge{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:100px;margin-bottom:12px;}
  .layer-badge svg{width:13px;height:13px;}
  .layer-private{color:var(--danger);background:var(--danger-soft);border:1px solid rgba(201,123,99,.45);}
  .layer-public{color:var(--teal);background:var(--teal-soft);border:1px solid rgba(91,154,160,.45);}
  .card.private{border-color:rgba(201,123,99,.25);}
  .note{padding:14px 0;border-bottom:1px solid var(--line);animation:paneIn .4s var(--ease) both;}
  .note:last-child{border-bottom:none;}
  .note-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .note-date{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--amber);}
  .note p{font-size:14px;line-height:1.65;color:var(--ink-dim);margin:8px 0 0;}
  .switch{display:flex;align-items:center;gap:12px;margin:4px 0 16px;cursor:pointer;font-size:14px;color:var(--ink-dim);user-select:none;}
  .switch input{position:absolute;opacity:0;width:0;height:0;}
  .switch-track{position:relative;width:42px;height:24px;flex-shrink:0;border-radius:100px;background:var(--line-strong);transition:background .25s;}
  .switch-track::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:transform .3s var(--ease);}
  .switch input:checked + .switch-track{background:var(--teal);}
  .switch input:checked + .switch-track::after{transform:translateX(18px);}
  .switch input:focus-visible + .switch-track{outline:2px solid var(--amber);outline-offset:3px;}
  .tag.draft{color:var(--ink-dim);}
  .tag.pub{color:var(--teal);border-color:var(--teal);background:var(--teal-soft);}
  .mini-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
  .mini{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .mini b{display:block;font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:500;margin-bottom:2px;}
  .mini b.low{color:var(--danger);} .mini b.mid{color:var(--amber);} .mini b.high{color:var(--teal);}
  .mini span{font-size:11.5px;color:var(--ink-faint);line-height:1.3;display:block;}

  /* ---------- hoja de ruta (cliente) ---------- */
  .route{position:relative;margin-bottom:28px;}
  .pass{display:flex;border-radius:var(--radius);overflow:hidden;background:linear-gradient(135deg,rgba(227,168,87,.16),rgba(91,154,160,.14));border:1px solid rgba(227,168,87,.3);box-shadow:0 24px 60px -32px rgba(227,168,87,.5);}
  .pass-main{flex:1;padding:22px 22px 20px;min-width:0;}
  .pass-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pass-dest{font-family:'Fraunces',serif;font-size:clamp(26px,6vw,36px);line-height:1.05;margin-bottom:14px;overflow-wrap:anywhere;}
  .pass-meta{display:flex;gap:22px;flex-wrap:wrap;}
  .pass-meta span{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:2px;}
  .pass-meta b{font-weight:500;font-size:14px;}
  .pass-count{display:inline-block;margin-top:14px;padding:6px 12px;border-radius:100px;background:rgba(18,21,31,.5);font-size:13px;color:var(--ink-dim);}
  .pass-count b{color:var(--amber);font-weight:600;}
  .pass-stub{position:relative;width:118px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-left:2px dashed rgba(255,255,255,.18);}
  .pass-stub::before,.pass-stub::after{content:'';position:absolute;left:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);}
  .pass-stub::before{top:-10px;} .pass-stub::after{bottom:-10px;}
  .ring{width:84px;height:84px;transform:rotate(-90deg);}
  .ring circle{fill:none;stroke-width:7;}
  .ring-bg{stroke:rgba(255,255,255,.1);}
  .ring-fg{stroke:var(--amber);stroke-linecap:round;stroke-dasharray:214;stroke-dashoffset:214;transition:stroke-dashoffset 1s var(--ease);}
  .ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-num b{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:500;}
  .ring-num span{font-size:10.5px;color:var(--ink-faint);}
  .letter{position:relative;margin:16px 0 0;padding:18px 20px;border-radius:14px;background:rgba(242,239,233,.05);border:1px solid var(--line);}
  .letter-from{display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:8px;}
  .letter-from svg{width:15px;height:15px;}
  .letter p{margin:0;font-family:'Fraunces',serif;font-style:italic;font-size:16.5px;line-height:1.6;color:var(--ink);}
  .when-tabs{display:flex;gap:6px;margin:20px 0 6px;overflow-x:auto;scrollbar-width:none;}
  .when-tabs::-webkit-scrollbar{display:none;}
  .when{white-space:nowrap;padding:8px 14px;border-radius:100px;border:1px solid var(--line-strong);background:none;color:var(--ink-dim);font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;}
  .when:hover{color:var(--ink);}
  .when.active{background:var(--amber-soft);border-color:rgba(227,168,87,.6);color:var(--amber);}
  .stamps-hint{margin:8px 0 12px;}
  .stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;}
  .stamp{position:relative;aspect-ratio:1;border-radius:50%;border:2px dashed var(--line-strong);background:var(--bg-raised);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-family:'Inter',sans-serif;transition:transform .35s var(--ease), border-color .3s, background .3s;overflow:hidden;}
  .stamp:hover{transform:translateY(-3px) rotate(-2deg);border-color:rgba(227,168,87,.6);}
  .stamp.open{border-style:solid;border-color:var(--amber);background:var(--amber-soft);}
  .stamp-ico{font-size:26px;line-height:1;margin-bottom:2px;transition:transform .3s var(--ease);}
  .stamp:hover .stamp-ico{transform:scale(1.15);}
  .stamp-name{font-size:12.5px;font-weight:600;text-align:center;padding:0 8px;line-height:1.2;}
  .stamp-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);}
  .stamp-seal{position:absolute;top:50%;left:50%;padding:3px 10px;border:2px solid var(--teal);border-radius:6px;color:var(--teal);font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:13px;letter-spacing:.14em;background:rgba(18,21,31,.72);transform:translate(-50%,-50%) rotate(-16deg) scale(0);opacity:0;pointer-events:none;}
  .stamp.sealed{border-style:solid;border-color:rgba(91,154,160,.6);background:var(--teal-soft);}
  .stamp.sealed .stamp-seal{opacity:1;transform:translate(-50%,-50%) rotate(-16deg) scale(1);}
  .stamp.sealed .stamp-ico,.stamp.sealed .stamp-name{opacity:.55;}
  .stamp.just .stamp-seal{animation:thump .55s var(--ease);}
  .stamp.just{animation:shakeS .45s .1s;}
  @keyframes thump{0%{transform:translate(-50%,-50%) rotate(-16deg) scale(2.4);opacity:0;}60%{opacity:1;}100%{transform:translate(-50%,-50%) rotate(-16deg) scale(1);opacity:1;}}
  @keyframes shakeS{30%{transform:scale(.94);}60%{transform:scale(1.04);}}
  .panel-box{margin-top:14px;padding:18px;border-radius:var(--radius);background:var(--bg-raised);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(227,168,87,.35);animation:paneIn .45s var(--ease);}
  .panel-head{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
  .panel-ico{font-size:28px;}
  .panel-head b{display:block;font-family:'Fraunces',serif;font-weight:500;font-size:19px;}
  .panel-head span{font-size:12.5px;color:var(--ink-faint);}
  .tasks{list-style:none;margin:0;padding:0;}
  .task{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line);}
  .task:last-child{border-bottom:none;}
  .tick{flex-shrink:0;width:28px;height:28px;border-radius:9px;border:1.5px solid var(--line-strong);background:var(--bg-deep);color:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .25s var(--ease);padding:0;}
  .tick svg{width:16px;height:16px;}
  .tick:hover{border-color:var(--teal);}
  .task.done .tick{background:var(--teal);border-color:var(--teal);color:#12151F;animation:pop .35s var(--ease);}
  .task-body{flex:1;min-width:0;}
  .task-text{display:block;font-size:15px;line-height:1.45;position:relative;transition:color .3s;}
  .task.done .task-text{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:rgba(91,154,160,.7);}
  .task-when{display:block;font-size:12px;color:var(--ink-faint);margin-top:3px;}
  .confetti{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:5;}
  .confetti i{position:absolute;top:30%;width:8px;height:12px;border-radius:2px;opacity:0;animation:conf 2.2s var(--ease) forwards;}
  @keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0);}100%{opacity:0;transform:translate(var(--x),420px) rotate(var(--r));}}

  /* ---------- hoja de ruta (editor admin) ---------- */
  .builder{margin:6px 0 18px;padding:16px;border-radius:14px;background:var(--bg-deep);border:1px solid var(--line);}
  .builder-title{font-weight:600;font-size:14px;margin-bottom:12px;}
  .cat-picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .cat-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:100px;border:1px solid var(--line-strong);background:none;color:var(--ink-dim);font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;}
  .cat-chip:hover{color:var(--ink);border-color:#46506a;}
  .cat-chip.active{background:var(--amber-soft);border-color:var(--amber);color:var(--ink);}
  .cat-chip em{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--amber);color:#12151F;border-radius:100px;padding:0 6px;}
  .when-pick{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .when-pick .hint{margin-right:4px;}
  .when-chip{padding:5px 11px;border-radius:100px;border:1px solid var(--line-strong);background:none;color:var(--ink-dim);font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;white-space:nowrap;}
  .when-chip.active{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);}
  .when-chip.mini{padding:3px 9px;font-size:11.5px;}
  .when-chip.mini:hover{border-color:var(--teal);color:var(--teal);}
  .ideas{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;}
  .ideas .hint{width:100%;margin-bottom:2px;}
  .idea{padding:7px 12px;border-radius:10px;border:1px dashed rgba(227,168,87,.45);background:rgba(227,168,87,.05);color:var(--ink);font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;text-align:left;transition:all .2s var(--ease);}
  .idea:hover{background:var(--amber-soft);border-style:solid;transform:translateY(-1px);}
  .add-row{display:flex;gap:8px;margin-bottom:14px;}
  .add-row input{flex:1;}
  .draft-group{margin-top:10px;}
  .draft-cat{font-size:12.5px;font-weight:600;color:var(--ink-dim);margin-bottom:4px;}
  .draft-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.03);margin-bottom:4px;animation:paneIn .3s var(--ease);}
  .draft-text{flex:1;font-size:14px;min-width:0;}
  .x{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:13px;padding:4px 6px;border-radius:6px;white-space:nowrap;}
  .x:hover{color:var(--ink);background:rgba(255,255,255,.06);}
  @media (max-width:560px){
    .pass-stub{width:96px;}
    .ring{width:70px;height:70px;}
    .stamps{grid-template-columns:repeat(3,1fr);gap:8px;}
    .stamp-ico{font-size:22px;}
    .stamp-name{font-size:11px;}
    .draft-item{flex-wrap:wrap;}
    .draft-text{flex-basis:100%;}
  }

  .own-add{margin-top:16px;}
  .own-toggle{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:100px;border:1px dashed rgba(91,154,160,.6);background:var(--teal-soft);color:var(--teal);font-size:14px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s var(--ease);}
  .own-toggle:hover{border-style:solid;transform:translateY(-1px);}
  .own-form{margin-top:12px;padding:16px;border-radius:14px;background:var(--bg-raised);border:1px solid rgba(91,154,160,.35);animation:paneIn .35s var(--ease);}
  .own-form .add-row{margin:0;}
  .own-form .primary{padding:12px 18px;}
  .own-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);background:var(--teal-soft);border:1px solid rgba(91,154,160,.45);border-radius:100px;padding:1px 7px;vertical-align:middle;text-decoration:none;}
  .task .own-del{align-self:center;}
  .own-summary{font-size:12.5px;color:var(--ink-dim);margin-top:6px;line-height:1.6;}
  .own-done{text-decoration:line-through;color:var(--ink-faint);}

  /* ---------- kit de seguridad (cliente) ---------- */
  .kit-head{display:flex;gap:18px;align-items:flex-start;}
  .kit-shield{flex-shrink:0;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--teal);background:var(--teal-soft);border:1px solid rgba(91,154,160,.45);}
  .kit-shield svg{width:28px;height:28px;}
  .kit-head-txt{flex:1;min-width:0;}
  .kit-bar{height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden;margin:14px 0 6px;}
  .kit-fill{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--teal),var(--amber));transition:width .9s var(--ease);}
  .kit-count{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-dim);letter-spacing:.04em;}
  .emer-card{margin-bottom:16px;padding:18px;border-radius:var(--radius);background:linear-gradient(135deg,rgba(201,123,99,.18),rgba(227,168,87,.1));border:1px solid rgba(201,123,99,.45);animation:paneIn .5s var(--ease);}
  .emer-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-bottom:12px;}
  .emer-title svg{color:var(--danger);}
  .emer-title span{margin-left:auto;font-weight:400;font-size:11.5px;color:var(--ink-faint);}
  .emer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .emer-grid a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:12px;background:rgba(18,21,31,.55);border:1px solid var(--line);text-decoration:none;color:var(--ink);transition:transform .2s var(--ease), border-color .2s;}
  .emer-grid a:hover{transform:translateY(-2px);border-color:var(--danger);}
  .emer-grid a b{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:500;color:var(--amber-hi);}
  .emer-grid a span{font-size:11.5px;color:var(--ink-dim);text-align:center;}
  .emer-grid a.wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:10px;}
  .emer-grid a.wide b{font-size:16px;white-space:nowrap;}
  .emer-grid a.wide span{text-align:left;}
  .trail{list-style:none;margin:0;padding:0;position:relative;}
  .trail::before{content:'';position:absolute;left:27px;top:28px;bottom:28px;width:2px;background:linear-gradient(var(--teal),var(--line-strong));}
  .node{position:relative;margin-bottom:10px;animation:paneIn .45s var(--ease) both;}
  .node:nth-child(2){animation-delay:.05s}.node:nth-child(3){animation-delay:.1s}.node:nth-child(4){animation-delay:.15s}.node:nth-child(5){animation-delay:.2s}.node:nth-child(6){animation-delay:.25s}.node:nth-child(7){animation-delay:.3s}
  .node-btn{width:100%;display:flex;align-items:center;gap:14px;padding:10px 14px 10px 6px;border-radius:16px;border:1px solid transparent;background:none;color:var(--ink);text-align:left;cursor:pointer;font-family:'Inter',sans-serif;transition:all .25s var(--ease);}
  .node-btn:hover:not(:disabled){background:var(--bg-raised);border-color:var(--line);transform:translateX(3px);}
  .node-btn:disabled{cursor:not-allowed;}
  .node-dot{position:relative;z-index:1;flex-shrink:0;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--bg-solid);border:2px solid var(--line-strong);color:var(--ink-faint);}

<script>
// ============================================================

// ============================================================
const SUPABASE_URL = 'https://xqazoxxthaupsknqknmb.supabase.co';

let state = { screen:'loading', session:null, profile:null, tab:'test', hasTest:null };

// ---------- utilidades ----------
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
// Escapa texto antes de meterlo en HTML (evita que un nombre o título ejecute código)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2br = s => esc(s).replace(/\n/g,'<br>');
function ytEmbed(url){
  try{ const m = url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{6,})/); if(m) return 'https://www.youtube.com/embed/'+m[1]; }catch(e){}
  return null;
}
function greeting(){ const h=new Date().getHours(); return h<12?'Buen día':h<20?'Buenas tardes':'Buenas noches'; }
// Las fechas sin hora (YYYY-MM-DD) se fijan al mediodía para que no se corran un día por la zona horaria
function fmtDate(d){ try{ return new Date(String(d).length===10 ? d+'T12:00:00' : d).toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return ''; } }
function toast(msg, kind='ok'){
  const t=document.createElement('div'); t.className='toast '+kind; t.textContent=msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),400); }, 3400);
}
function showErr(node, msg){ node.textContent=msg; node.classList.remove('shake'); void node.offsetWidth; node.classList.add('shake'); }
function skeleton(n=2){ return Array.from({length:n}).map(()=>`<div class="skel"><i style="width:30%"></i><i style="width:70%;height:18px"></i><i style="width:92%"></i><i style="width:80%;margin:0"></i></div>`).join(''); }
let keyHandler=null;
function setKeys(fn){ if(keyHandler) document.removeEventListener('keydown',keyHandler); keyHandler=fn; if(fn) document.addEventListener('keydown',fn); }

const svg=(d)=>`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON={
  arrow: svg('<path d="M5 12h14M13 6l6 6-6 6"/>'),
  lock: svg('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),
  compass: svg('<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>'),
  quote: svg('<path d="M7 17c-2 0-3-1.5-3-4 0-3 2-6 5-7M17 17c-2 0-3-1.5-3-4 0-3 2-6 5-7"/>'),
  shield: svg('<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/>'),
  clip: svg('<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/>'),
  panel: svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 20V9"/>'),
  plus: svg('<path d="M12 5v14M5 12h14"/>'),
  map: svg('<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>'),
  eye: svg('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
  check: svg('<path d="M5 12l5 5 9-10"/>'),
  info: svg('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'),
  chevron: svg('<path d="M6 9l6 6 6-6"/>'),
  play: svg('<path d="M8 5l11 7-11 7z"/>'),
  image: svg('<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/>'),
  text: svg('<path d="M5 6h14M5 11h14M5 16h9"/>'),
  mark: `<svg viewBox="0 0 100 100" width="28" height="28" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="#1F2433" stroke="#333B4D" stroke-width="2"/><path d="M20 60 Q50 30 80 60" stroke="#E3A857" stroke-width="7" fill="none" stroke-linecap="round"/></svg>`
};

function sunrise(cls=''){
  return `<svg class="sunrise ${cls}" viewBox="0 0 320 110" aria-hidden="true">
    <defs>
      <radialGradient id="sunG"><stop offset="0%" stop-color="#FBE0B4"/><stop offset="100%" stop-color="#E3A857"/></radialGradient>
      <radialGradient id="glowG"><stop offset="0%" stop-color="#E3A857" stop-opacity=".55"/><stop offset="100%" stop-color="#E3A857" stop-opacity="0"/></radialGradient>
      <clipPath id="above"><rect x="0" y="0" width="320" height="80"/></clipPath>
    </defs>
    <g clip-path="url(#above)"><g class="sun-rise">
      <circle class="sun-glow" cx="160" cy="80" r="72" fill="url(#glowG)"/>
      <circle cx="160" cy="80" r="30" fill="url(#sunG)"/>
    </g></g>
    <path class="draw" d="M12 80 H308" stroke="#E3A857" stroke-width="2"/>
    <path class="draw d2" d="M62 93 Q160 87 258 93" stroke="#5B9AA0" stroke-width="2" opacity=".75"/>
    <path class="draw d3" d="M104 104 Q160 100 216 104" stroke="#5B9AA0" stroke-width="2" opacity=".4"/>
  </svg>`;
}

async function refreshHasTest(){
  const { data } = await sb.from('test_submissions').select('id').eq('user_id', state.session.user.id).maybeSingle();
  state.hasTest = !!data;
  return state.hasTest;
}

async function loadUserAndRoute(){
  const { data: profile } = await sb.from('profiles').select('*').eq('id', state.session.user.id).single();
  state.profile = profile;
  await refreshHasTest();
  state.tab = state.hasTest ? 'experiencia' : 'test';
  state.screen = (profile && profile.name) ? 'welcome' : 'nameCapture';
  render();
}

async function init(){
  render();
  const { data: { session } } = await sb.auth.getSession();
  if(session){ state.session = session; await loadUserAndRoute(); }
  else { state.screen = 'login'; render(); }
}

sb.auth.onAuthStateChange((event, session) => {
  if(event === 'SIGNED_OUT'){ state.session=null; state.profile=null; state.screen='login'; render(); }
  if(event === 'PASSWORD_RECOVERY'){ state.session=session; state.screen='resetPassword'; render(); }
});

function render(){
  setKeys(null);
  const app = document.getElementById('app');
  app.innerHTML = '';
  let node;
  if(state.screen==='loading') node = el(`<div class="loading-screen">${sunrise('sm')}<p class="hint">Preparando tu espacio…</p></div>`);
  else if(state.screen==='login') node = renderLogin();
  else if(state.screen==='nameCapture') node = renderNameCapture();
  else if(state.screen==='resetPassword') node = renderResetPassword();
  else if(state.screen==='welcome') node = renderWelcome();
  else if(state.screen==='dashboard') node = renderDashboard();
  app.appendChild(node);
  if(node._after) node._after();
  window.scrollTo({top:0});
}

// ---------- LOGIN ----------
function renderLogin(){
  const wrap = el(`<div class="auth">
    <div class="rv" style="--d:0">${sunrise()}</div>
    <div class="eyebrow rv" style="--d:1">Nómade con Sentido</div>
    <h1 class="rv" style="--d:2">Tu espacio, <em>a tu ritmo.</em></h1>
    <p class="lead rv" style="--d:3">Ingresá con el mail y la contraseña que definiste al aceptar la invitación que te llegó por correo.</p>
    <form class="card rv" style="--d:4" id="loginForm" novalidate>
      <div class="field"><label for="e">Email</label><input type="email" id="e" autocomplete="username"/></div>
      <div class="field"><label for="p">Contraseña</label><input type="password" id="p" autocomplete="current-password"/></div>
      <p class="err" id="err"></p>
      <button type="submit" class="primary wide" id="loginBtn"><span>Ingresar</span>${ICON.arrow}</button>
    </form>
    <p class="hint center-t rv" style="--d:5">¿No tenés acceso todavía? Escribile a Valentina.</p>
    <p class="hint center-t rv" style="--d:6"><a href="#" id="forgot" class="link">Olvidé mi contraseña</a></p>
  </div>`);
  wrap.querySelector('#forgot').onclick = async (e)=>{
    e.preventDefault();
    const email = wrap.querySelector('#e').value.trim();
    if(!email){ toast('Escribí tu email arriba primero y volvé a tocar el link.','bad'); wrap.querySelector('#e').focus(); return; }
    const { error } = await sb.auth.resetPasswordForEmail(email);
    toast(error ? ('No se pudo enviar: '+error.message) : 'Te enviamos un mail para restablecer tu contraseña.', error?'bad':'ok');
  };
  wrap.querySelector('#loginForm').onsubmit = async (e)=>{
    e.preventDefault();
    const email = wrap.querySelector('#e').value.trim();
    const password = wrap.querySelector('#p').value;
    const errEl = wrap.querySelector('#err');
    const btn = wrap.querySelector('#loginBtn');
    errEl.textContent = '';
    if(!email || !password){ showErr(errEl,'Completá email y contraseña.'); return; }
    btn.classList.add('loading'); btn.querySelector('span').textContent='Ingresando';
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ showErr(errEl,'Email o contraseña incorrectos.'); btn.classList.remove('loading'); btn.querySelector('span').textContent='Ingresar'; return; }
    state.session = data.session;
    await loadUserAndRoute();
  };
  return wrap;
}

// ---------- CAPTURA DE NOMBRE ----------
function renderNameCapture(){
  const wrap = el(`<div class="center">
    <div class="rv" style="--d:0">${sunrise('sm')}</div>
    <div class="eyebrow rv" style="--d:1">Nómade con Sentido</div>
    <h1 class="rv" style="--d:2;font-size:30px;">¿Cómo te <em>llamás?</em></h1>
    <p class="lead rv" style="--d:3">Así sabemos cómo dirigirnos a vos en tu espacio.</p>
    <form class="rv" style="--d:4" id="f">
      <input type="text" id="name" placeholder="Tu nombre" autocomplete="given-name"/>
      <p class="err" id="err" style="margin-top:10px;"></p>
      <button type="submit" class="primary wide" id="saveName"><span>Continuar</span>${ICON.arrow}</button>
    </form>
  </div>`);
  wrap._after = ()=> wrap.querySelector('#name').focus();
  wrap.querySelector('#f').onsubmit = async (e)=>{
    e.preventDefault();
    const name = wrap.querySelector('#name').value.trim();
    const errEl = wrap.querySelector('#err');
    const btn = wrap.querySelector('#saveName');
    if(!name){ showErr(errEl,'Contanos tu nombre para continuar.'); return; }
    btn.classList.add('loading');
    const { error } = await sb.from('profiles').update({ name }).eq('id', state.session.user.id);
    if(error){ btn.classList.remove('loading'); showErr(errEl,'No se pudo guardar, probá de nuevo.'); return; }
    state.profile = { ...state.profile, name };
    state.screen = 'welcome';
    render();
  };
  return wrap;
}

// ---------- NUEVA CONTRASEÑA ----------
function renderResetPassword(){
  const wrap = el(`<div class="center">
    <div class="rv" style="--d:0">${sunrise('sm')}</div>
    <div class="eyebrow rv" style="--d:1">Nómade con Sentido</div>
    <h1 class="rv" style="--d:2;font-size:30px;">Nueva <em>contraseña</em></h1>
    <p class="lead rv" style="--d:3">Elegí tu nueva contraseña para entrar a tu espacio.</p>
    <form class="rv" style="--d:4;text-align:left;" id="f">
      <div class="field"><input type="password" id="p1" placeholder="Contraseña nueva" autocomplete="new-password"/></div>
      <div class="field"><input type="password" id="p2" placeholder="Repetila" autocomplete="new-password"/></div>
      <p class="err" id="err"></p>
      <button type="submit" class="primary wide" id="save"><span>Guardar</span>${ICON.arrow}</button>
    </form>
  </div>`);
  wrap.querySelector('#f').onsubmit = async (e)=>{
    e.preventDefault();
    const p1 = wrap.querySelector('#p1').value, p2 = wrap.querySelector('#p2').value;
    const errEl = wrap.querySelector('#err');
    const btn = wrap.querySelector('#save');
    if(!p1 || p1.length < 6){ showErr(errEl,'La contraseña debe tener al menos 6 caracteres.'); return; }
    if(p1 !== p2){ showErr(errEl,'Las contraseñas no coinciden.'); return; }
    btn.classList.add('loading');
    const { error } = await sb.auth.updateUser({ password: p1 });
    if(error){ btn.classList.remove('loading'); showErr(errEl,'No se pudo guardar, probá de nuevo.'); return; }
    toast('Contraseña actualizada.');
    await loadUserAndRoute();
  };
  return wrap;
}

// ---------- BIENVENIDA ----------

// ---------- DASHBOARD ----------
function renderDashboard(){
  const isAdmin = state.profile && state.profile.is_admin;
  const display = (state.profile && state.profile.name) ? state.profile.name : state.session.user.email;
  const tabs = [
    !state.hasTest && {id:'test', label:'Test pre-sesión', icon:ICON.clip},
    {id:'plan', label:'Tu plan', icon:ICON.map},
    {id:'experiencia', label:'Experiencia de emigrar', icon:ICON.compass},
    {id:'testimonios', label:'Testimonios', icon:ICON.quote},
    {id:'seguridad', label:'Seguridad para el nómade', icon:ICON.shield},
    isAdmin && {id:'admin', label:'Panel profesional', icon:ICON.panel},
  ].filter(Boolean);

  const wrap = el(`<div>
    <header class="topbar rv" style="--d:0">
      <div class="brand">${ICON.mark}<span>Nómade con Sentido</span></div>
      <div class="top-right">
        <div class="avatar" title="${esc(state.session.user.email)}">${esc(String(display).trim().charAt(0).toUpperCase())}</div>
        <button class="ghost" id="logout">Salir</button>
      </div>
    </header>
    <section class="dash-hero">
      <div class="eyebrow rv" style="--d:1">${greeting()}</div>
      <h1 class="rv" style="--d:2">Hola, <em>${esc(display)}</em></h1>
    </section>
    <nav class="tabs rv" style="--d:3" role="tablist">
      <span class="tab-ind"></span>
      ${tabs.map(t=>`<button class="tab" role="tab" data-tab="${t.id}">${t.icon}<span>${t.label}</span></button>`).join('')}
    </nav>
    <div id="tabContent" class="rv" style="--d:4"></div>
    <p class="foot-note">${ICON.lock} Espacio privado y confidencial — protegido por secreto profesional.</p>
  </div>`);
  wrap.querySelector('#logout').onclick = async ()=>{ await sb.auth.signOut(); };
  wrap.querySelectorAll('.tab').forEach(t=>{ t.onclick = ()=>{ if(state.tab!==t.dataset.tab){ state.tab = t.dataset.tab; paintTab(wrap); } }; });
  wrap._after = ()=>{ paintTab(wrap); if(document.fonts) document.fonts.ready.then(()=>moveIndicator(wrap)); };
  return wrap;
}

function moveIndicator(wrap){
  const nav = wrap.querySelector('.tabs'); if(!nav) return;
  const active = nav.querySelector('.tab.active'); const ind = nav.querySelector('.tab-ind');
  if(!active) return;
  ind.style.width = active.offsetWidth+'px';
  ind.style.transform = `translateX(${active.offsetLeft}px)`;
  if(nav.scrollWidth > nav.clientWidth) nav.scrollTo({left: active.offsetLeft - 24, behavior:'smooth'});
}
window.addEventListener('resize', ()=>{ const w=document.querySelector('#app > div'); if(w && state.screen==='dashboard') moveIndicator(w); });

function paintTab(wrap){
  setKeys(null);
  const isAdmin = state.profile && state.profile.is_admin;
  wrap.querySelectorAll('.tab').forEach(t=>{ const on = t.dataset.tab===state.tab; t.classList.toggle('active',on); t.setAttribute('aria-selected',on); });
  moveIndicator(wrap);
  const content = wrap.querySelector('#tabContent');
  content.innerHTML = '';
  const pane = el(`<div class="tab-pane"></div>`);
  content.appendChild(pane);
  if(state.tab==='test' && !state.hasTest) renderTest(pane);
  else if(state.tab==='plan') renderClientPlan(pane);
  else if(state.tab==='experiencia') renderResourceList(pane,'experiencia','Todavía no hay contenido cargado en esta sección.');
  else if(state.tab==='testimonios') renderResourceList(pane,'testimonio','Todavía no hay testimonios cargados.');
  else if(state.tab==='seguridad') renderSafety(pane);
  else if(state.tab==='admin' && isAdmin) renderAdmin(pane);
}

// ---------- TEST (una afirmación por vez) ----------
async function renderTest(container){
  container.innerHTML = skeleton(1);
  const { data: existing } = await sb.from('test_submissions').select('*').eq('user_id', state.session.user.id).maybeSingle();
  container.innerHTML = '';
  if(existing){
    container.appendChild(el(`<div class="card" style="text-align:center;"><div class="done-mark">${ICON.check}</div><p class="lead" style="margin:0 auto;">Ya completaste tu test el ${new Date(existing.submitted_at).toLocaleDateString('es-AR')}. Valentina ya lo tiene para tu sesión.</p></div>`));
    return;
  }
  const answers = {};
  let idx = 0, locked = false;
  const root = el(`<div>
    <div class="journey">
      <div class="journey-track"><div class="journey-fill" id="jf"></div><div class="journey-sun" id="js"></div></div>
      <div class="journey-meta"><span id="jc">0 / ${QUESTIONS.length}</span><span id="jsub"></span></div>
    </div>
    <div class="banner">${ICON.info}<span>Este es un instrumento de autoconocimiento, no un test clínico ni un diagnóstico. Es información para que tu sesión con Valentina sea más precisa.</span></div>
    <p class="hint" style="margin:0 0 16px;">No hay respuestas correctas. Marcá lo que más se acerca a cómo sos hoy. <span class="kbd-hint">También podés usar las teclas 1–5.</span></p>
    <div class="q-stage" id="stage"></div>
  </div>`);
  container.appendChild(root);
  const stage = root.querySelector('#stage');

  function progress(){
    const done = Object.keys(answers).length;
    const pct = done/QUESTIONS.length*100;
    root.querySelector('#jf').style.width = pct+'%';
    root.querySelector('#js').style.left = pct+'%';
    root.querySelector('#jc').textContent = done+' / '+QUESTIONS.length;
  }

  function showQ(dir=1){
    if(idx >= QUESTIONS.length){ showSummary(dir); return; }
    locked = false;
    const q = QUESTIONS[idx];
    root.querySelector('#jsub').textContent = 'Parte '+q.sub;
    const qc = el(`<div class="q-card ${dir>0?'in-right':'in-left'}">
      <div class="q-chip">Parte ${q.sub} · ${SUB_LABEL[q.sub]}</div>
      <div class="q-num">${String(idx+1).padStart(2,'0')}</div>
      <p class="q-text">${q.text}</p>
      <div class="scale" role="radiogroup" aria-label="Qué tan así sos, de 1 a 5">
        ${[1,2,3,4,5].map(v=>`<button type="button" class="opt ${answers[q.id]===v?'selected':''}" role="radio" aria-checked="${answers[q.id]===v}" data-v="${v}">${v}</button>`).join('')}
      </div>
      <div class="scale-caption"><span>1 = Nunca así</span><span>5 = Totalmente así</span></div>
      <div class="q-nav">
        <button type="button" class="ghost" id="prev" ${idx===0?'disabled':''}>← Anterior</button>
        ${answers[q.id] ? '<button type="button" class="ghost" id="next">Siguiente →</button>' : ''}
      </div>
    </div>`);
    stage.innerHTML = ''; stage.appendChild(qc);
    qc.querySelectorAll('.opt').forEach(o=> o.onclick = ()=> pick(parseInt(o.dataset.v)));
    qc.querySelector('#prev').onclick = ()=>{ if(idx>0){ idx--; showQ(-1); } };
    const nx = qc.querySelector('#next'); if(nx) nx.onclick = ()=>{ idx++; showQ(1); };
  }

  function pick(v){
    if(locked || idx>=QUESTIONS.length) return;
    locked = true;
    const q = QUESTIONS[idx];
    answers[q.id] = v;
    stage.querySelectorAll('.opt').forEach(o=>{ const on = parseInt(o.dataset.v)===v; o.classList.toggle('selected',on); o.setAttribute('aria-checked',on); });
    progress();
    setTimeout(()=>{ idx++; showQ(1); }, 340);
  }

  function showSummary(dir){
    root.querySelector('#jsub').textContent = 'Completo';
    const sc = el(`<div class="q-card ${dir>0?'in-right':'in-left'}" style="text-align:center;">
      <div class="done-mark">${ICON.check}</div>
      <h2>Respondiste las <em>${QUESTIONS.length}</em> afirmaciones</h2>
      <p class="lead" style="margin:0 auto 22px;">Si querés, revisá tus respuestas antes de enviarlas. Una vez enviadas, le llegan a Valentina para preparar tu sesión.</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        <button type="button" class="ghost" id="review">Revisar respuestas</button>
        <button type="button" class="primary" id="sendTest"><span>Enviar</span>${ICON.arrow}</button>
      </div>
    </div>`);
    stage.innerHTML = ''; stage.appendChild(sc);
    sc.querySelector('#review').onclick = ()=>{ idx=0; showQ(-1); };
    sc.querySelector('#sendTest').onclick = async ()=>{
      const btn = sc.querySelector('#sendTest');
      btn.classList.add('loading'); btn.querySelector('span').textContent='Enviando';
      const { error } = await sb.from('test_submissions').insert({ user_id: state.session.user.id, answers });
      if(error){ toast('No se pudo enviar. Probá de nuevo.','bad'); btn.classList.remove('loading'); btn.querySelector('span').textContent='Enviar'; return; }
      setKeys(null);
      stage.innerHTML = '';
      stage.appendChild(el(`<div class="q-card in-right" style="text-align:center;padding:44px 26px;">
        <div class="done-mark">${ICON.check}</div>
        <h2>¡Listo! <em>Gracias.</em></h2>
        <p class="lead" style="margin:0 auto;">Valentina ya tiene tu test para la sesión. Te llevamos a tu espacio…</p>
      </div>`));
      state.hasTest = true;
      state.tab = 'experiencia';
      setTimeout(render, 2200);
    };
  }

  setKeys(e=>{
    if(e.target.matches('input,textarea,select')) return;
    const n = parseInt(e.key);
    if(n>=1 && n<=5) pick(n);
    else if(e.key==='ArrowLeft' && idx>0 && !locked){ idx--; showQ(-1); }
  });
  progress();
  showQ(1);
}

const uid = () => Math.random().toString(36).slice(2,10);
function daysUntil(d){ if(!d) return null; const t=new Date(d+'T12:00:00'); const n=new Date(); n.setHours(12,0,0,0); return Math.round((t-n)/86400000); }

// ---------- TU PLAN (vista del cliente) ----------
async function renderClientPlan(container){
  container.innerHTML = skeleton(2);
  const { data: items, error } = await sb.from('client_feedback').select('*').eq('client_id', state.session.user.id).eq('published', true).order('created_at',{ascending:false});
  container.innerHTML = '';
  if(error || !items || items.length===0){
    container.appendChild(el(`<div class="card empty"><div class="empty-icon">${ICON.map}</div><p class="lead" style="margin:0 auto;">Después de tu sesión, Valentina va a dejarte acá tu hoja de ruta personalizada.</p></div>`));
    return;
  }
  const ids = items.map(i=>i.id);
  const { data: prog } = await sb.from('plan_progress').select('feedback_id,item_id').in('feedback_id', ids);
  const done = new Set((prog||[]).map(p=>p.feedback_id+':'+p.item_id));
  // Tareas que sumó el propio cliente
  const { data: own } = await sb.from('client_tasks').select('*').in('feedback_id', ids).order('created_at',{ascending:true});
  (own||[]).forEach(o=>{ if(o.done) done.add(o.feedback_id+':own-'+o.id); });
  items.forEach((fb,i)=>{
    const base = Array.isArray(fb.items) ? fb.items : [];
    const mine = (own||[]).filter(o=>o.feedback_id===fb.id).map(ownToTask);
    if(base.length || mine.length) container.appendChild(renderRoute(fb, [...base, ...mine], done, i));
    else container.appendChild(renderLegacyPlan(fb, i));
  });
}

// Devoluciones viejas (antes de la hoja de ruta): pasos por línea
function renderLegacyPlan(it, i){
  const steps = (it.action_plan||'').split('\n').map(x=>x.trim()).filter(Boolean);
  return el(`<article class="plan-card rv" style="--d:${Math.min(i,6)}">
    <div class="eyebrow">${fmtDate(it.created_at)}</div>
    <h2>${esc(it.title)}</h2>
    ${it.body ? `<p class="res-body prewrap" style="margin:0;">${esc(it.body)}</p>` : ''}
    ${steps.length ? `<div class="plan-label">Tu plan de acción</div><ol class="plan-steps">${steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>` : ''}
  </article>`);
}

const ownToTask = o => ({ id:'own-'+o.id, dbId:o.id, own:true, cat:o.cat, when:o.stage, text:o.text });

function renderRoute(fb, tasks, done, i){
  const key = t => fb.id+':'+t.id;
  const dleft = daysUntil(fb.departure_date);
  const countdown = dleft==null ? '' : dleft>1 ? `Faltan <b>${dleft}</b> días` : dleft===1 ? `¡Salís <b>mañana</b>!` : dleft===0 ? `¡<b>Hoy</b> es el día!` : `Ya estás en <b>ruta</b>`;
  const cats = () => ROUTE_CATS.filter(c=>tasks.some(t=>t.cat===c.id));
  let filter = 'todo';
  let openCat = null;

  const root = el(`<article class="route rv" style="--d:${Math.min(i,6)}">
    <div class="pass">
      <div class="pass-main">
        <div class="pass-label">Hoja de ruta · ${esc(fb.title)}</div>
        <div class="pass-dest">${esc(fb.destination || 'Tu próximo destino')}</div>
        <div class="pass-meta">
          ${fb.departure_date ? `<div><span>Salida</span><b>${fmtDate(fb.departure_date)}</b></div>` : ''}
          <div><span>Pasajero/a</span><b>${esc((state.profile&&state.profile.name)||'Vos')}</b></div>
        </div>
        ${countdown ? `<div class="pass-count">${countdown}</div>` : ''}
      </div>
      <div class="pass-stub">
        <svg class="ring" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="34" class="ring-bg"/><circle cx="40" cy="40" r="34" class="ring-fg"/></svg>
        <div class="ring-num"><b id="pct">0%</b><span>listo</span></div>
      </div>
    </div>
    ${fb.body ? `<div class="letter"><div class="letter-from">${ICON.quote} Mensaje de Valentina</div><p class="prewrap">${esc(fb.body)}</p></div>` : ''}
    <div class="when-tabs" role="tablist">
      <button class="when active" data-w="todo">Todo</button>
      ${ROUTE_WHEN.map(w=>`<button class="when" data-w="${w.id}">${w.label}</button>`).join('')}
    </div>
    <p class="hint stamps-hint">Cada sello se completa cuando tachás todas sus tareas. Tocá uno para abrirlo.</p>
    <div class="stamps"></div>
    <div class="stamp-panel"></div>
    <div class="own-add">
      <button class="own-toggle" type="button">${ICON.plus}<span>Sumá una tarea tuya</span></button>
      <div class="own-form hidden">
        <p class="hint" style="margin:0 0 10px;">Algo que sabés que tenés que hacer y no está en la lista. Valentina también la va a ver.</p>
        <div class="grid-2">
          <div class="field"><label>Categoría</label><select class="own-cat">${ROUTE_CATS.map(c=>`<option value="${c.id}">${c.icon} ${c.label}</option>`).join('')}</select></div>
          <div class="field"><label>¿Cuándo?</label><select class="own-when">${ROUTE_WHEN.map(w=>`<option value="${w.id}">${w.label}</option>`).join('')}</select></div>
        </div>
        <div class="add-row"><input type="text" class="own-text" placeholder="Ej: Vender la bici antes de irme" maxlength="160"/><button class="primary own-save" type="button"><span>Sumar</span>${ICON.arrow}</button></div>
      </div>
    </div>
  </article>`);

  const stampsEl = root.querySelector('.stamps');
  const panel = root.querySelector('.stamp-panel');
  const visible = () => tasks.filter(t=> filter==='todo' || t.when===filter);

  function updateRing(){
    const total = tasks.length, n = tasks.filter(t=>done.has(key(t))).length;
    const pct = total ? Math.round(n/total*100) : 0;
    root.querySelector('#pct').textContent = pct+'%';
    const c = 2*Math.PI*34;
    const fg = root.querySelector('.ring-fg');
    fg.style.strokeDasharray = c;
    fg.style.strokeDashoffset = c*(1-pct/100);
    return pct;
  }

  function drawStamps(){
    stampsEl.innerHTML = '';
    const vis = visible();
    cats().forEach(c=>{
      const ct = vis.filter(t=>t.cat===c.id);
      if(!ct.length) return;
      const n = ct.filter(t=>done.has(key(t))).length;
      const complete = n===ct.length;
      const b = el(`<button class="stamp ${complete?'sealed':''} ${openCat===c.id?'open':''}" data-c="${c.id}" aria-expanded="${openCat===c.id}">
        <span class="stamp-ico">${c.icon}</span>
        <span class="stamp-name">${c.label}</span>
        <span class="stamp-count">${n}/${ct.length}</span>
        <span class="stamp-seal" aria-hidden="true">LISTO</span>
      </button>`);
      b.onclick = ()=>{ openCat = openCat===c.id ? null : c.id; drawStamps(); drawPanel(); };
      stampsEl.appendChild(b);
    });
    if(!stampsEl.children.length) stampsEl.innerHTML = '<p class="hint">No hay tareas para esta etapa.</p>';
  }

  function drawPanel(){
    panel.innerHTML = '';
    if(!openCat) return;
    const c = catById(openCat);
    const ct = visible().filter(t=>t.cat===openCat);
    if(!ct.length){ openCat=null; return; }
    const box = el(`<div class="panel-box">
      <div class="panel-head"><span class="panel-ico">${c.icon}</span><div><b>${c.label}</b><span>${c.hint}</span></div></div>
      <ul class="tasks"></ul>
    </div>`);
    const ul = box.querySelector('.tasks');
    ct.forEach(t=>{
      const isDone = done.has(key(t));
      const li = el(`<li class="task ${isDone?'done':''}">
        <button class="tick" role="checkbox" aria-checked="${isDone}" aria-label="Marcar como hecha">${ICON.check}</button>
        <div class="task-body">
          <span class="task-text">${esc(t.text)}${t.own ? ' <span class="own-badge">tuya</span>' : ''}</span>
          <span class="task-when">${whenLabel(t.when)}${t.link ? ` · <a href="${esc(t.link)}" target="_blank" rel="noopener" class="link">abrir link ↗</a>` : ''}</span>
        </div>
        ${t.own ? '<button class="x own-del" title="Quitar tarea">✕</button>' : ''}
      </li>`);
      li.querySelector('.tick').onclick = ()=> toggle(t, li);
      if(t.own) li.querySelector('.own-del').onclick = ()=> removeOwn(t);
      ul.appendChild(li);
    });
    panel.appendChild(box);
  }

  let busy = false;
  async function toggle(t, li){
    if(busy) return; busy = true;
    const k = key(t), was = done.has(k);
    // Optimista: se marca al instante y se revierte si falla
    if(was) done.delete(k); else done.add(k);
    li.classList.toggle('done', !was); li.querySelector('.tick').setAttribute('aria-checked', !was);
    const { error } = t.own
      ? await sb.from('client_tasks').update({ done: !was }).eq('id', t.dbId)
      : was
        ? await sb.from('plan_progress').delete().eq('feedback_id', fb.id).eq('item_id', t.id)
        : await sb.from('plan_progress').insert({ feedback_id: fb.id, item_id: t.id, client_id: state.session.user.id });
    busy = false;
    if(error){
      if(was) done.add(k); else done.delete(k);
      li.classList.toggle('done', was);
      toast('No se pudo guardar. Probá de nuevo.','bad'); return;
    }
    const before = root.querySelector('.stamp.sealed[data-c="'+t.cat+'"]');
    const pct = updateRing();
    drawStamps();
    const after = root.querySelector('.stamp.sealed[data-c="'+t.cat+'"]');
    if(!was && after && !before){ after.classList.add('just'); toast('¡Sello conseguido! '+catById(t.cat).icon+' '+catById(t.cat).label); }
    if(!was && pct===100) celebrate(root);
  }

  root.querySelectorAll('.when').forEach(b=> b.onclick = ()=>{
    filter = b.dataset.w;
    root.querySelectorAll('.when').forEach(x=>x.classList.toggle('active', x===b));
    drawStamps(); drawPanel();
  });

  // ----- tareas propias -----
  const ownForm = root.querySelector('.own-form');
  root.querySelector('.own-toggle').onclick = ()=>{
    ownForm.classList.toggle('hidden');
    if(!ownForm.classList.contains('hidden')){
      if(openCat) root.querySelector('.own-cat').value = openCat;
      if(filter!=='todo') root.querySelector('.own-when').value = filter;
      root.querySelector('.own-text').focus();
    }
  };
  const ownText = root.querySelector('.own-text');
  ownText.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); root.querySelector('.own-save').click(); } };
  root.querySelector('.own-save').onclick = async ()=>{
    const text = ownText.value.trim();
    if(!text){ ownText.focus(); return; }
    const btn = root.querySelector('.own-save');
    const cat = root.querySelector('.own-cat').value, stage = root.querySelector('.own-when').value;
    btn.classList.add('loading');
    const { data, error } = await sb.from('client_tasks').insert({ feedback_id: fb.id, client_id: state.session.user.id, cat, stage, text }).select().single();
    btn.classList.remove('loading');
    if(error || !data){ toast('No se pudo sumar la tarea. Probá de nuevo.','bad'); return; }
    tasks.push(ownToTask(data));
    ownText.value = '';
    openCat = cat;
    updateRing(); drawStamps(); drawPanel();
    toast('Tarea sumada a tu hoja de ruta.');
  };
  async function removeOwn(t){
    if(!confirm('¿Quitar "'+t.text+'" de tu hoja de ruta?')) return;
    const { error } = await sb.from('client_tasks').delete().eq('id', t.dbId);
    if(error){ toast('No se pudo quitar. Probá de nuevo.','bad'); return; }
    tasks.splice(tasks.indexOf(t),1);
    done.delete(key(t));
    updateRing(); drawStamps(); drawPanel();
  }

  requestAnimationFrame(()=>{ updateRing(); });
  drawStamps();
  return root;
}

function celebrate(root){
  toast('¡Hoja de ruta completa! Estás lista/o para despegar ✈️');
  const layer = el(`<div class="confetti" aria-hidden="true"></div>`);
  const colors = ['#E3A857','#F6C98A','#5B9AA0','#C97B63','#F2EFE9'];
  for(let i=0;i<44;i++){
    const p = document.createElement('i');
    p.style.left = (Math.random()*100)+'%';
    p.style.background = colors[i%colors.length];
    p.style.animationDelay = (Math.random()*0.4)+'s';
    p.style.setProperty('--x', (Math.random()*160-80)+'px');
    p.style.setProperty('--r', (Math.random()*720-360)+'deg');
    layer.appendChild(p);
  }
  root.appendChild(layer);
  setTimeout(()=>layer.remove(), 2600);
}
