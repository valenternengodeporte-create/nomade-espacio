const telLink = n => `tel:${String(n).replace(/[^\d+]/g,'')}`;
const mapLink = (name, zoneName) => 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(name+', '+(zoneName||''));
const safeUrl = u => /^https?:\/\//i.test(String(u||'').trim()) ? String(u).trim() : '';

// Arma las tarjetas de la misión "Tu zona" desde los datos cargados por Valentina
function zoneCards(z){
  const c = z.content || {};
  const cards = [];
  const health = c.health || [];
  if(health.length) cards.push({ h:'Salud en '+esc(z.name), b: health.map(x=>`<div class="zitem"><b>${esc(x.name)}</b>${x.addr?`<span>${esc(x.addr)}</span>`:''}${x.note?`<span class="znote">${esc(x.note)}</span>`:''}<a class="zmap" href="${mapLink(x.name, z.name)}" target="_blank" rel="noopener">Ver en el mapa ↗</a></div>`).join('') });
  const police = c.police || [];
  const report = c.report && safeUrl(c.report.url);
  if(police.length || report) cards.push({ h:'Policía y denuncias', b:
    police.map(x=>`<div class="zitem"><b>${esc(x.name)}</b>${x.addr?`<span>${esc(x.addr)}</span>`:''}${x.phone?`<a class="ztel" href="${telLink(x.phone)}">${esc(x.phone)}</a>`:''}${x.note?`<span class="znote">${esc(x.note)}</span>`:''}</div>`).join('')
    + (report ? `<a class="zbtn" href="${esc(report)}" target="_blank" rel="noopener">${esc(c.report.label||'Hacer el B.O. online')} ↗</a>` : '') });
  const k = c.consulate;
  if(k && (k.name || k.phone || k.emergency)) cards.push({ h:'Tu consulado', b:`<div class="zitem"><b>${esc(k.name||'Consulado argentino')}</b>${k.addr?`<span>${esc(k.addr)}</span>`:''}
    ${k.phone?`<span>Teléfono: <a class="ztel" href="${telLink(k.phone)}">${esc(k.phone)}</a></span>`:''}
    ${k.emergency?`<span>Guardia (urgencias): <a class="ztel" href="${telLink(k.emergency)}">${esc(k.emergency)}</a></span>`:''}
    ${safeUrl(k.web)?`<a class="zmap" href="${esc(safeUrl(k.web))}" target="_blank" rel="noopener">Sitio oficial ↗</a>`:''}</div>` });
  const vid = c.video && ytEmbed(c.video);
  const vertical = c.video && /shorts\//.test(c.video);
  if(vid || c.tips) cards.push({ h:'Consejos de Valentina', b:
    (vid ? `<div class="zvideo ${vertical?'vertical':''}"><iframe src="${esc(vid)}" title="Consejos de Valentina sobre ${esc(z.name)}" loading="lazy" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe></div>` : '')
    + (c.tips ? `<div class="ztips"><div class="ztips-label">Lo más importante</div><p class="prewrap" style="margin:0;">${esc(c.tips)}</p></div>` : '') });
  if(!cards.length) cards.push({ h:esc(z.name), b:'Valentina está terminando de cargar la información de esta zona.' });
  return cards;
}

async function renderSafety(container){
  container.innerHTML = skeleton(2);
  const me = state.session.user.id;
  const [{ data: cs }, { data: prog }, { data: reqs }] = await Promise.all([
    sb.from('client_safety').select('*').eq('client_id', me).maybeSingle(),
    sb.from('safety_progress').select('mission_id').eq('client_id', me),
    sb.from('zone_requests').select('*').eq('client_id', me).eq('resolved', false),
  ]);
  let zone = null;
  if(cs && cs.zone_id){ const { data: z } = await sb.from('safety_zones').select('*').eq('id', cs.zone_id).maybeSingle(); zone = z; }
  const done = new Set((prog||[]).map(p=>p.mission_id));
  let pendingReq = (reqs||[])[0] || null;
  container.innerHTML = '';

  const root = el(`<div class="kit">
    <div class="kit-head card">
      <div class="kit-shield">${ICON.shield}</div>
      <div class="kit-head-txt">
        <div class="eyebrow" style="margin:0 0 4px;">Kit de emergencia del nómade</div>
        <h2 style="margin:0 0 4px;">Desbloqueá tu kit, misión por misión</h2>
        <p class="hint" style="margin:0;">Cada misión dura 2 minutos y termina con una pregunta. Al acertarla, se abre la siguiente.</p>
        <div class="kit-bar"><div class="kit-fill"></div></div>
        <div class="kit-count"></div>
      </div>
    </div>
    <div class="emer"></div>
    <ol class="trail"></ol>
  </div>`);
  container.appendChild(root);

  const unlockedUpTo = ()=>{ let i=0; while(i<SAFETY_MISSIONS.length && done.has(SAFETY_MISSIONS[i].id)) i++; return i; };

  function drawHead(){
    const n = SAFETY_MISSIONS.filter(m=>done.has(m.id)).length;
    root.querySelector('.kit-fill').style.width = (n/SAFETY_MISSIONS.length*100)+'%';
    root.querySelector('.kit-count').textContent = n===SAFETY_MISSIONS.length ? '¡Kit completo! Lo tenés siempre a mano acá.' : `${n} de ${SAFETY_MISSIONS.length} misiones`;
  }
  // Tarjeta de emergencia: aparece al completar la primera misión
  function drawEmergency(){
    const box = root.querySelector('.emer');
    if(!done.has('numeros')){ box.innerHTML=''; return; }
    const k = zone && zone.content && zone.content.consulate;
    box.innerHTML = `<div class="emer-card">
      <div class="emer-title">${ICON.shield} Tu tarjeta de emergencia <span>tocá para llamar</span></div>
      <div class="emer-grid">
        <a href="tel:192"><b>192</b><span>Ambulancia</span></a>
        <a href="tel:190"><b>190</b><span>Policía</span></a>
        <a href="tel:193"><b>193</b><span>Bomberos</span></a>
        <a href="tel:180"><b>180</b><span>Mujeres</span></a>
        ${k && k.emergency ? `<a href="${telLink(k.emergency)}" class="wide"><b>${esc(k.emergency)}</b><span>Guardia del consulado argentino</span></a>` : ''}
      </div>
    </div>`;
  }
  function drawTrail(fresh){
    const ol = root.querySelector('.trail');
    const up = unlockedUpTo();
    ol.innerHTML = '';
    SAFETY_MISSIONS.forEach((m,i)=>{
      const isDone = done.has(m.id), isCur = i===up, locked = i>up;
      const title = m.zone ? (zone ? 'Tu zona: '+esc(zone.name) : 'Tu zona') : m.title;
      const sub = m.zone && !zone ? (pendingReq ? 'Pediste: '+esc(pendingReq.place)+'. Valentina la está preparando.' : 'Todavía no tenés zona asignada') : m.sub;
      const li = el(`<li class="node ${isDone?'done':''} ${isCur?'current':''} ${locked?'locked':''} ${fresh===m.id?'fresh':''}">
        <button class="node-btn" ${locked?'disabled':''} aria-label="${locked?'Bloqueada: ':''}${m.title}">
          <span class="node-dot">${isDone?ICON.check:locked?ICON.lock:`<span>${m.icon}</span>`}</span>
          <span class="node-txt"><b>${title}</b><span>${sub}</span></span>
          <span class="node-go">${isDone?'Repasar':isCur?'Empezar →':''}</span>
        </button>
      </li>`);
      if(!locked) li.querySelector('.node-btn').onclick = ()=> openMission(m);
      ol.appendChild(li);
    });
  }
  function redraw(fresh){ drawHead(); drawEmergency(); drawTrail(fresh); }

  // ----- lector de misión (hoja a pantalla completa) -----
  function openMission(m){
    const cards = m.zone ? (zone ? zoneCards(zone) : null) : m.cards;
    const sheet = el(`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(m.title)}">
      <div class="sheet-inner">
        <div class="sheet-top"><span class="sheet-ico">${m.icon}</span><div class="sheet-title">${m.zone && zone ? 'Tu zona: '+esc(zone.name) : m.title}</div><button class="sheet-x" aria-label="Cerrar">✕</button></div>
        <div class="dots"></div>
        <div class="sheet-body"></div>
      </div>
    </div>`);
    document.body.appendChild(sheet);
    document.body.style.overflow='hidden';
    const body = sheet.querySelector('.sheet-body');
    const close = ()=>{ sheet.classList.add('out'); document.body.style.overflow=''; setKeys(null); setTimeout(()=>sheet.remove(),250); };
    sheet.querySelector('.sheet-x').onclick = close;
    sheet.onclick = e=>{ if(e.target===sheet) close(); };

    // Sin zona asignada: formulario para pedirla
    if(!cards){
      sheet.querySelector('.dots').innerHTML='';
      body.innerHTML = `<div class="scard">
        <h3>¿Dónde vas a estar?</h3>
        <p>Valentina arma la info de cada lugar a mano (salud, policía, consulado) para que sea confiable. Contale adónde vas y la va a sumar a tu kit.</p>
        ${pendingReq ? `<p class="banner" style="margin:0 0 14px;">Ya pediste <b>${esc(pendingReq.place)}</b>. Te avisamos cuando esté lista.</p>` : ''}
        <div class="field"><input type="text" class="zreq" placeholder="Ej: Itacaré, Bahía" maxlength="80"/></div>
        <button class="primary wide zsend"><span>${pendingReq?'Pedir otra zona':'Pedir mi zona'}</span>${ICON.arrow}</button>
      </div>`;
      const inp = body.querySelector('.zreq');
      setTimeout(()=>inp.focus(),300);
      body.querySelector('.zsend').onclick = async ()=>{
        const place = inp.value.trim(); if(!place){ inp.focus(); return; }
        const btn = body.querySelector('.zsend'); btn.classList.add('loading');
        const { data, error } = await sb.from('zone_requests').insert({ client_id: me, place }).select().single();
        btn.classList.remove('loading');
        if(error){ toast('No se pudo enviar. Probá de nuevo.','bad'); return; }
        pendingReq = data || { place };
        toast('¡Listo! Valentina recibió tu pedido.');
        close(); drawTrail();
      };
      return;
    }

    const steps = cards.length + 1; // tarjetas + cierre (quiz o confirmación)
    let idx = 0;
    const dots = sheet.querySelector('.dots');
    dots.innerHTML = Array.from({length:steps}).map(()=>'<i></i>').join('');
    const paintDots = ()=> dots.querySelectorAll('i').forEach((d,i)=>{ d.classList.toggle('on', i<=idx); });

    function show(dir=1){
      paintDots();
      body.innerHTML = '';
      if(idx < cards.length){
        const c = cards[idx];
        const card = el(`<div class="scard ${dir>0?'in-right':'in-left'}">
          <div class="scard-n">${idx+1} / ${cards.length}</div>
          <h3>${c.h}</h3>
          <div class="scard-b">${c.b}</div>
          <div class="sheet-nav">
            <button class="ghost" ${idx===0?'disabled':''} data-a="prev">← Atrás</button>
            <button class="primary" data-a="next"><span>${idx===cards.length-1?(m.quiz?'Ir a la pregunta':'Terminar'):'Siguiente'}</span>${ICON.arrow}</button>
          </div>
        </div>`);
        card.querySelector('[data-a="prev"]').onclick = ()=>{ if(idx>0){ idx--; show(-1); } };
        card.querySelector('[data-a="next"]').onclick = ()=>{ idx++; show(1); };
        body.appendChild(card);
        return;
      }
      // Cierre
      if(m.quiz && !done.has(m.id)) showQuiz(); else finish(done.has(m.id));
    }

    function showQuiz(){
      const q = m.quiz;
      const card = el(`<div class="scard in-right">
        <div class="scard-n">Pregunta para desbloquear</div>
        <h3>${q.q}</h3>
        <div class="qopts">${q.opts.map((o,i)=>`<button class="qopt" data-i="${i}">${o}</button>`).join('')}</div>
        <p class="qwhy hidden"></p>
      </div>`);
      body.appendChild(card);
      card.querySelectorAll('.qopt').forEach(b=> b.onclick = ()=>{
        const i = +b.dataset.i;
        if(i===q.a){
          b.classList.add('right');
          card.querySelectorAll('.qopt').forEach(x=>x.disabled=true);
          setTimeout(()=>finish(false), 650);
        } else {
          b.classList.add('wrong'); b.disabled = true;
          const w = card.querySelector('.qwhy'); w.textContent = 'Casi. Probá con otra opción.'; w.classList.remove('hidden');
        }
      });
    }

    async function finish(already){
      if(!already){
        const { error } = await sb.from('safety_progress').insert({ client_id: me, mission_id: m.id });
        if(error && !String(error.message||'').includes('duplicate')){ toast('No se pudo guardar tu avance. Probá de nuevo.','bad'); return; }
        done.add(m.id);
      }
      const next = SAFETY_MISSIONS[SAFETY_MISSIONS.findIndex(x=>x.id===m.id)+1];
      const all = SAFETY_MISSIONS.every(x=>done.has(x.id));
      body.innerHTML = '';
      body.appendChild(el(`<div class="scard badge-card in-right">
        <div class="badge-big">${m.icon}</div>
        <h3>${already ? 'Repaso completo' : '¡Misión cumplida!'}</h3>
        <p>${m.quiz && !already ? esc(m.quiz.why) : ''}</p>
        ${!already && next ? `<p class="unlock">${ICON.lock} Desbloqueaste: <b>${next.zone ? 'Tu zona' : next.title}</b></p>` : ''}
        ${!already && m.id==='numeros' ? '<p class="unlock">Tu tarjeta de emergencia ya está arriba de todo, lista para llamar.</p>' : ''}
        ${!already && all ? '<p class="unlock">Completaste todo el kit. Buen viaje.</p>' : ''}
        <button class="primary wide" data-a="ok"><span>Volver al kit</span>${ICON.arrow}</button>
      </div>`));
      idx = steps-1; paintDots();
      body.querySelector('[data-a="ok"]').onclick = ()=>{ close(); redraw(already?null:(next&&next.id)); };
    }

    setKeys(e=>{
      if(e.key==='Escape') close();
      else if(e.key==='ArrowRight' && idx<cards.length){ idx++; show(1); }
      else if(e.key==='ArrowLeft' && idx>0 && idx<=cards.length-1){ idx--; show(-1); }
    });
    show(1);
  }

  redraw();
}

function scoreSubmission(answers){
  const sub={A:0,B:0,C:0};
  QUESTIONS.forEach(q=>{ sub[q.sub]+=(answers[q.id]||0); });
  const level = v=> v<=9?'low':v<=14?'mid':'high';
  const levels = {A:level(sub.A),B:level(sub.B),C:level(sub.C)};
  const lows = Object.entries(levels).filter(([k,v])=>v==='low').map(([k])=>k);
  let profile, label;
  if(lows.length===3){ profile='Alerta — recomendar posponer, trabajar antes de la partida'; label='Alerta'; }
  else if(lows.length===0 && Object.values(levels).every(v=>v==='high')){ profile='Explorador estable'; label='Explorador estable'; }
  else if(lows.includes('A')){ profile='Alta motivación, baja regulación emocional'; label='Baja regulación'; }
  else if(lows.includes('B')){ profile='Buscador de certezas (dependencia de validación externa)'; label='Buscador de certezas'; }
  else if(lows.includes('C')){ profile='Rígido con plan alto (riesgo si falla plan A)'; label='Rígido con plan'; }
  else { profile='Perfil mixto — revisar detalle por subescala'; label='Perfil mixto'; }
  return {sub, levels, profile, label};
}

    }).join('');
    $('#catPicker').querySelectorAll('.cat-chip').forEach(b=> b.onclick = ()=>{ curCat=b.dataset.c; drawPicker(); drawIdeas(); });
    $('#whenPick').innerHTML = '<span class="hint">¿Cuándo?</span>' + ROUTE_WHEN.map(w=>`<button type="button" class="when-chip ${w.id===curWhen?'active':''}" data-w="${w.id}">${w.label}</button>`).join('');
    $('#whenPick').querySelectorAll('.when-chip').forEach(b=> b.onclick = ()=>{ curWhen=b.dataset.w; drawPicker(); });
  }
  function drawIdeas(){
    const c = catById(curCat);
    const used = new Set(draft.map(t=>t.text));
    const free = c.ideas.filter(x=>!used.has(x));
    $('#ideas').innerHTML = free.length
      ? '<span class="hint">Sugerencias — tocá para sumar:</span>' + free.map(x=>`<button type="button" class="idea">+ ${esc(x)}</button>`).join('')
      : '<span class="hint">Ya sumaste todas las sugerencias de esta categoría.</span>';
    $('#ideas').querySelectorAll('.idea').forEach((b,i)=> b.onclick = ()=> addTask(free[i]));
  }
  function drawDraft(){
    const box = $('#draft');
    $('#fCount').textContent = draft.length ? `· ${draft.length} en total` : '';
    if(!draft.length){ box.innerHTML = '<p class="hint" style="margin:0;">Todavía no agregaste tareas.</p>'; return; }
    box.innerHTML = ROUTE_CATS.filter(c=>draft.some(t=>t.cat===c.id)).map(c=>`
      <div class="draft-group"><div class="draft-cat">${c.icon} ${c.label}</div>
      ${draft.filter(t=>t.cat===c.id).map(t=>`<div class="draft-item" data-id="${t.id}">
        <span class="draft-text">${esc(t.text)}</span>
        <button type="button" class="when-chip mini" data-a="when" title="Cambiar etapa">${whenLabel(t.when)}</button>
        <button type="button" class="x" data-a="link" title="Agregar link">${t.link?'🔗':'＋🔗'}</button>
        <button type="button" class="x" data-a="del" title="Quitar">✕</button>
      </div>`).join('')}</div>`).join('');
    box.querySelectorAll('.draft-item').forEach(row=>{
      const t = draft.find(x=>x.id===row.dataset.id);
      row.querySelector('[data-a="del"]').onclick = ()=>{ draft = draft.filter(x=>x!==t); refresh(); };
      row.querySelector('[data-a="when"]').onclick = ()=>{ const i=ROUTE_WHEN.findIndex(w=>w.id===t.when); t.when = ROUTE_WHEN[(i+1)%ROUTE_WHEN.length].id; drawDraft(); };
      row.querySelector('[data-a="link"]').onclick = ()=>{ const v = prompt('Link para esta tarea (dejalo vacío para quitarlo):', t.link||''); if(v!==null){ t.link = v.trim(); drawDraft(); } };
    });
  }
  function refresh(){ drawPicker(); drawIdeas(); drawDraft(); }
  function addTask(text){
    text = (text||'').trim(); if(!text) return;
    draft.push({ id: uid(), cat: curCat, when: curWhen, text, link:'' });
    refresh();
  }
  $('#fAdd').onclick = ()=>{ addTask($('#fTask').value); $('#fTask').value=''; $('#fTask').focus(); };
  $('#fTask').onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#fAdd').click(); } };

  const fClear = ()=>{ fbEditing=null; draft=[]; ['#fTitle','#fBody','#fDest','#fDate','#fTask'].forEach(k=>$(k).value=''); $('#fPub').checked=false; $('#fHead').textContent='Hoja de ruta'; $('#fSave span').textContent='Guardar'; $('#fCancel').classList.add('hidden'); $('#fErr').textContent=''; refresh(); };
  $('#fCancel').onclick = fClear;
  $('#fSave').onclick = async ()=>{
    const title = $('#fTitle').value.trim() || 'Tu hoja de ruta';
    const body = $('#fBody').value.trim();
    const destination = $('#fDest').value.trim() || null;
    const departure_date = $('#fDate').value || null;
    const published = $('#fPub').checked;
    const btn = $('#fSave');
    if(!draft.length && !body){ showErr($('#fErr'),'Agregá al menos una tarea o un mensaje.'); return; }
    btn.classList.add('loading');
    const row = { title, body, destination, departure_date, items: draft, published };
    const q = fbEditing
      ? sb.from('client_feedback').update(row).eq('id', fbEditing)
      : sb.from('client_feedback').insert({ client_id: client.id, ...row });
    const { error } = await q;
    btn.classList.remove('loading');
    if(error){ showErr($('#fErr'),'No se pudo guardar: '+error.message+(error.message.includes('column')?' — ¿corriste el SQL 03_hoja_de_ruta.sql?':'')); return; }
    toast(published ? 'Publicada: '+cname+' ya la ve en "Tu plan".' : 'Guardada como borrador.');
    fClear(); loadFb();
  };
  async function loadFb(){
    const box = $('#fList');
    box.innerHTML = skeleton(1);
    const { data } = await sb.from('client_feedback').select('*').eq('client_id', client.id).order('created_at',{ascending:false});
    const ids = (data||[]).map(f=>f.id);
    const { data: prog } = ids.length ? await sb.from('plan_progress').select('feedback_id').in('feedback_id', ids) : { data: [] };
    const { data: own } = ids.length ? await sb.from('client_tasks').select('feedback_id,text,done,cat').in('feedback_id', ids) : { data: [] };
    box.innerHTML='';
    if(!data || data.length===0){ box.innerHTML='<p class="hint">Sin hojas de ruta todavía.</p>'; return; }
    data.forEach((f,i)=>{
      const total = Array.isArray(f.items) ? f.items.length : 0;
      const mine = (own||[]).filter(o=>o.feedback_id===f.id);
      const doneN = (prog||[]).filter(p=>p.feedback_id===f.id).length + mine.filter(o=>o.done).length;
      const all = total + mine.length;
      const r = el(`<div class="adm-row" style="animation-delay:${Math.min(i,10)*40}ms">
        <div><div style="font-weight:600;">${esc(f.title)}${f.destination?` · ${esc(f.destination)}`:''}</div><div class="hint">${fmtDate(f.created_at)}${all?` · ${esc(cname)} completó ${doneN}/${all}`:''}</div>
        ${mine.length ? `<div class="own-summary"><span class="own-badge">sumó ${mine.length}</span> ${mine.map(o=>`<span class="${o.done?'own-done':''}">${catById(o.cat).icon} ${esc(o.text)}</span>`).join(' · ')}</div>` : ''}</div>
        <div class="adm-actions" style="align-items:center;"><span class="tag ${f.published?'pub':'draft'}">${f.published?'Publicada':'Borrador'}</span><button class="ghost" data-a="e">Editar</button><button class="ghost danger" data-a="d">Borrar</button></div>
      </div>`);
      r.querySelector('[data-a="e"]').onclick = ()=>{
        fbEditing=f.id;
        $('#fTitle').value=f.title||''; $('#fBody').value=f.body||''; $('#fDest').value=f.destination||''; $('#fDate').value=f.departure_date||'';
        // Devoluciones viejas: cada línea del plan se convierte en una tarea editable
        draft = (Array.isArray(f.items) && f.items.length) ? f.items.map(t=>({...t}))
          : (f.action_plan||'').split('\n').map(x=>x.trim()).filter(Boolean).map(text=>({ id:uid(), cat:'mente', when:'antes', text, link:'' }));
        $('#fPub').checked=f.published; $('#fHead').textContent='Editando: '+f.title; $('#fSave span').textContent='Guardar cambios'; $('#fCancel').classList.remove('hidden');
        refresh(); fb.scrollIntoView({behavior:'smooth', block:'start'});
      };
      r.querySelector('[data-a="d"]').onclick = async ()=>{ if(!confirm('¿Borrar "'+f.title+'"? No se puede deshacer.')) return; await sb.from('client_feedback').delete().eq('id', f.id); if(fbEditing===f.id) fClear(); toast('Hoja de ruta eliminada.'); loadFb(); };
      box.appendChild(r);
    });
  }
  refresh();
  pane.appendChild(fb);
  loadFb();
}

// ---------- ADMIN: KIT DE SEGURIDAD (zonas y pedidos) ----------
// Formato de líneas: campos separados por " | "
const toLines = (arr, keys) => (arr||[]).map(o=>keys.map(k=>o[k]||'').join(' | ').replace(/( \| )+$/,'')).join('\n');
const fromLines = (txt, keys) => String(txt||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const p=l.split('|').map(s=>s.trim()); const o={}; keys.forEach((k,i)=>{ if(p[i]) o[k]=p[i]; }); return o; }).filter(o=>o[keys[0]]);

async function renderAdminSafety(container){
  container.innerHTML = skeleton(2);
  const [{ data: zones }, { data: reqs }, { data: people }] = await Promise.all([
    sb.from('safety_zones').select('*').order('name',{ascending:true}),
    sb.from('zone_requests').select('*').eq('resolved', false).order('created_at',{ascending:false}),
    sb.from('profiles').select('id,name,email'),
  ]);
  container.innerHTML = '';
  if(!zones){ container.appendChild(el(`<div class="card"><p class="err">No se pudo cargar. ¿Corriste el SQL 04_kit_seguridad.sql?</p></div>`)); return; }
  const who = id => { const p=(people||[]).find(x=>x.id===id); return p ? (p.name||p.email||'Cliente') : 'Cliente'; };

  // Pedidos de zona
  if((reqs||[]).length){
    const rc = el(`<div class="card req-card"><div class="layer-badge layer-public">${ICON.map} Pedidos de zona</div><h2>Te pidieron estas zonas</h2><div class="rl"></div></div>`);
    reqs.forEach(r=>{
      const row = el(`<div class="adm-row"><div><div style="font-weight:600;">${esc(r.place)}</div><div class="hint">${esc(who(r.client_id))} · ${fmtDate(r.created_at)}</div></div>
        <div class="adm-actions"><button class="ghost" data-a="new">Crear zona</button><button class="ghost" data-a="ok">Resuelto</button></div></div>`);
      row.querySelector('[data-a="new"]').onclick = ()=>{ openZoneForm(null, r.place); };
      row.querySelector('[data-a="ok"]').onclick = async ()=>{ await sb.from('zone_requests').update({ resolved:true }).eq('id', r.id); toast('Pedido marcado como resuelto. Asignale la zona desde su ficha.'); renderAdminSafety(container); };
      rc.querySelector('.rl').appendChild(row);
    });
    container.appendChild(rc);
  }

  // Lista de zonas
  const lc = el(`<div class="card"><h2>Zonas cargadas</h2><p class="hint" style="margin-top:-4px;">Cada zona se carga una sola vez y sirve para todos los clientes que vayan ahí. La asignás desde la ficha de cada cliente.</p><div class="zl"></div><button class="ghost" data-a="add" style="margin-top:12px;">${ICON.plus} Nueva zona</button></div>`);
  const zl = lc.querySelector('.zl');
  if(!zones.length) zl.innerHTML = '<p class="hint">Todavía no hay zonas.</p>';
  zones.forEach((z,i)=>{
    const c = z.content||{};
    const row = el(`<div class="adm-row" style="animation-delay:${Math.min(i,10)*40}ms"><div><div style="font-weight:600;">📍 ${esc(z.name)}${z.state?` <span class="hint">· ${esc(z.state)}</span>`:''}</div>
      <div class="hint">${(c.health||[]).length} de salud · ${(c.police||[]).length} de policía${c.consulate&&c.consulate.name?' · consulado':''} · actualizada ${fmtDate(z.updated_at||z.created_at)}</div></div>
      <div class="adm-actions"><button class="ghost" data-a="e">Editar</button></div></div>`);
    row.querySelector('[data-a="e"]').onclick = ()=> openZoneForm(z);
    zl.appendChild(row);
  });
  lc.querySelector('[data-a="add"]').onclick = ()=> openZoneForm(null);
  container.appendChild(lc);

  const formSlot = el(`<div></div>`);
  container.appendChild(formSlot);

  function openZoneForm(z, presetName){
    const c = (z && z.content) || {};
    const k = c.consulate || {};
    formSlot.innerHTML = '';
    const f = el(`<div class="card zone-form">
      <h2>${z ? 'Editando: '+esc(z.name) : 'Nueva zona'}</h2>
      <div class="grid-2">
        <div class="field"><label>Nombre de la zona</label><input type="text" id="zName" placeholder="Ej: Florianópolis"/></div>
        <div class="field"><label>Estado</label><input type="text" id="zState" placeholder="Ej: Santa Catarina"/></div>
      </div>
      <div class="field"><label>Salud — una por línea: <code>Nombre | Dirección o barrio | Nota</code></label><textarea id="zHealth" style="min-height:110px;" placeholder="UPA Norte da Ilha | Vargem Grande | Urgencias 24 h"></textarea></div>
      <div class="field"><label>Policía — una por línea: <code>Nombre | Dirección | Teléfono | Nota</code></label><textarea id="zPolice" style="min-height:80px;" placeholder="DEAT (policía del turista) | Av. ... | (21) 2332-2429 | Atiende extranjeros"></textarea></div>
      <div class="grid-2">
        <div class="field"><label>Denuncia online: texto del botón</label><input type="text" id="zRepL" placeholder="Hacer el B.O. online"/></div>
        <div class="field"><label>Denuncia online: link</label><input type="text" id="zRepU" placeholder="https://..."/></div>
      </div>
      <div class="builder-title" style="margin-top:6px;">Consulado argentino</div>
      <div class="grid-2">
        <div class="field"><label>Nombre</label><input type="text" id="kName"/></div>
        <div class="field"><label>Dirección</label><input type="text" id="kAddr"/></div>
        <div class="field"><label>Teléfono</label><input type="text" id="kPhone"/></div>
        <div class="field"><label>Guardia (urgencias)</label><input type="text" id="kEmer"/></div>
      </div>
      <div class="field"><label>Sitio web del consulado</label><input type="text" id="kWeb" placeholder="https://..."/></div>
      <div class="field"><label>Video de la zona (link de YouTube, puede ser "No listado" o un Short)</label><input type="text" id="zVideo" placeholder="https://youtu.be/..."/></div>
      <div class="field"><label>Tus consejos para esta zona — 3 o 4 líneas con lo más importante</label><textarea id="zTips" placeholder="Barrios, horarios, playas, lo que sabés por experiencia..."></textarea></div>
      <p class="err" id="zErr"></p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;"><button class="primary" id="zSave"><span>Guardar zona</span>${ICON.arrow}</button><button class="ghost" id="zCancel">Cancelar</button>${z?'<button class="ghost danger" id="zDel">Borrar zona</button>':''}</div>
    </div>`);
    const $ = s => f.querySelector(s);
    $('#zName').value = z ? z.name : (presetName||'');
    $('#zState').value = (z && z.state) || '';
    $('#zHealth').value = toLines(c.health, ['name','addr','note']);
    $('#zPolice').value = toLines(c.police, ['name','addr','phone','note']);
    $('#zRepL').value = (c.report && c.report.label) || '';
    $('#zRepU').value = (c.report && c.report.url) || '';
    $('#kName').value = k.name||''; $('#kAddr').value = k.addr||''; $('#kPhone').value = k.phone||''; $('#kEmer').value = k.emergency||''; $('#kWeb').value = k.web||'';
    $('#zTips').value = c.tips || '';
    $('#zVideo').value = c.video || '';
    $('#zCancel').onclick = ()=>{ formSlot.innerHTML=''; };
    if(z) $('#zDel').onclick = async ()=>{
      if(!confirm('¿Borrar la zona "'+z.name+'"? Los clientes que la tengan asignada se quedan sin zona.')) return;
      const { error } = await sb.from('safety_zones').delete().eq('id', z.id);
      if(error){ showErr($('#zErr'),'No se pudo borrar: '+error.message); return; }
      toast('Zona borrada.'); renderAdminSafety(container);
    };
    $('#zSave').onclick = async ()=>{
      const name = $('#zName').value.trim();
      if(!name){ showErr($('#zErr'),'Poné el nombre de la zona.'); return; }
      const v = $('#zVideo').value.trim();
      if(v && !ytEmbed(v)){ showErr($('#zErr'),'El link del video no parece de YouTube. Copialo desde "Compartir" en YouTube.'); return; }
      const content = {
        health: fromLines($('#zHealth').value, ['name','addr','note']),
        police: fromLines($('#zPolice').value, ['name','addr','phone','note']),
        report: { label: $('#zRepL').value.trim(), url: $('#zRepU').value.trim() },
        consulate: { name:$('#kName').value.trim(), addr:$('#kAddr').value.trim(), phone:$('#kPhone').value.trim(), emergency:$('#kEmer').value.trim(), web:$('#kWeb').value.trim() },
        tips: $('#zTips').value.trim(),
        video: $('#zVideo').value.trim(),
      };
      const row = { name, state: $('#zState').value.trim() || null, content };
      const btn = $('#zSave'); btn.classList.add('loading');
      const { error } = z ? await sb.from('safety_zones').update(row).eq('id', z.id) : await sb.from('safety_zones').insert(row);
      btn.classList.remove('loading');
      if(error){ showErr($('#zErr'), error.message.includes('duplicate') ? 'Ya existe una zona con ese nombre.' : 'No se pudo guardar: '+error.message); return; }
      toast(z ? 'Zona actualizada.' : 'Zona creada. Asignala desde la ficha del cliente.');
      renderAdminSafety(container);
    };
    formSlot.appendChild(f);
    f.scrollIntoView({behavior:'smooth', block:'start'});
  }
}

// Tarjeta dentro de la ficha del cliente: asignar zona y ver avance
async function renderClientSafetyCard(pane, client, cname){
  const card = el(`<div class="card">
    <div class="layer-badge layer-public">${ICON.shield} Kit de seguridad</div>
    <h2>Zona de ${esc(cname)}</h2>
    <div class="zone-assign">
      <select id="csZone"><option value="">Sin zona asignada</option></select>
      <button class="primary" id="csSave"><span>Asignar</span>${ICON.arrow}</button>
    </div>
    <p class="hint" id="csInfo" style="margin:10px 0 0;"></p>
  </div>`);
  pane.appendChild(card);
  const [{ data: zones }, { data: cs }, { data: prog }, { data: reqs }] = await Promise.all([
    sb.from('safety_zones').select('id,name').order('name',{ascending:true}),
    sb.from('client_safety').select('*').eq('client_id', client.id).maybeSingle(),
    sb.from('safety_progress').select('mission_id').eq('client_id', client.id),
    sb.from('zone_requests').select('place').eq('client_id', client.id).eq('resolved', false),
  ]);
  const sel = card.querySelector('#csZone');
  (zones||[]).forEach(z=> sel.appendChild(el(`<option value="${z.id}">${esc(z.name)}</option>`)));
  if(cs && cs.zone_id) sel.value = cs.zone_id;
  const n = (prog||[]).length;
  const pend = (reqs||[]).map(r=>r.place);
  card.querySelector('#csInfo').innerHTML = `Completó <b>${n} de ${SAFETY_MISSIONS.length}</b> misiones.` + (pend.length ? ` Pidió zona: <b>${esc(pend.join(', '))}</b> — creala en "Kit de seguridad" y asignala acá.` : '');
  card.querySelector('#csSave').onclick = async ()=>{
    const btn = card.querySelector('#csSave'); btn.classList.add('loading');
    const zone_id = sel.value || null;
    const { error } = await sb.from('client_safety').upsert({ client_id: client.id, zone_id }, { onConflict:'client_id' });
    btn.classList.remove('loading');
    if(error){ toast('No se pudo asignar: '+error.message,'bad'); return; }
    toast(zone_id ? 'Zona asignada: '+sel.options[sel.selectedIndex].text+'.' : 'Zona quitada.');
  };
}
